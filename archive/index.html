<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Byte — Archive</title>
<meta name="description" content="Past editions of the Daily Byte digest.">
<link rel="canonical" href="https://learn.shenthar.me/archive/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="../style.css">
<script src="../assets/app.js?v=3" defer></script>
</head>
<body data-page="archive">
<div class="chrome"><div class="chrome-in">
  <div class="left">
    <a href="../"><strong>Daily Byte</strong></a>
    <a href="https://github.com/KTS-o7/learning-portal" target="_blank" rel="noopener">Source</a>
    <a href="./">Archive</a>
    <a href="../rss.xml">RSS</a>
  </div>
  <div class="nav"><a class="nav-arrow" href="../" aria-label="Today">‹</a><span class="d">Archive</span><span class="nav-arrow disabled">›</span></div>
  <div class="right"></div>
</div></div>

<main class="archive">
  <h1>Daily Byte — Archive</h1>
  <p class="sub" id="archive-count">…</p>
  <ul id="archive-list"></ul>
  <p class="back"><a href="../">← Today</a></p>
</main>

<footer class="foot">
  Curated daily by your <strong>Hermes</strong> agent ·
  <a href="https://github.com/KTS-o7/learning-portal" target="_blank" rel="noopener">open source</a> ·
  served from learn.shenthar.me
</footer>

<script>
/* Archive list — reads archive.json and renders one row per edition.
   Kept inline so the archive page works without any per-day digest JSON. */
(function () {
  fetch("../archive.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (dates) {
      var ul = document.getElementById("archive-list");
      var cnt = document.getElementById("archive-count");
      if (!ul) return;
      cnt.textContent = dates.length + " editions, newest first";
      dates.forEach(function (iso) {
        var d = new Date(iso + "T00:00:00Z");
        var label = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()] +
                    ", " + ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getUTCMonth()] +
                    " " + d.getUTCDate() + ", " + d.getUTCFullYear();
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = iso + ".html";
        var dEl = document.createElement("span"); dEl.className = "d"; dEl.textContent = iso;
        var lEl = document.createElement("span"); lEl.className = "lbl"; lEl.textContent = label.split(",")[0];
        var cEl = document.createElement("span"); cEl.className = "cnt"; cEl.textContent = iso;
        a.appendChild(dEl); a.appendChild(lEl); a.appendChild(cEl);
        li.appendChild(a);
        ul.appendChild(li);
      });
    })
    .catch(function () {
      var cnt = document.getElementById("archive-count");
      if (cnt) cnt.textContent = "Archive unavailable.";
    });
})();
</script>
</body>
</html>
