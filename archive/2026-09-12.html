<script type="application/json" id="digest-data">{"date": "2026-09-12", "label": "Saturday, September 12, 2026", "edition_tag": "vol-2-no-37", "total": 17, "prev_day": "2026-09-11", "next_day": null, "site": {"name": "Daily Byte", "tagline": "A byte-size daily digest for engineers who value depth over noise.", "base_url": "https://learn.shenthar.me", "repo": "https://github.com/KTS-o7/learning-portal"}, "sections": [{"name": "engineering", "label": "Engineering", "intro": "Independent engineering blogs lead with concrete trade-offs and post-mortems rather than product launches.", "stories": [{"id": "eng-01", "title": "Marketing ops as code: Automating events from planning to follow-up on GitHub", "url": "https://github.blog/ai-and-ml/github-copilot/marketing-ops-as-code-automating-events-from-planning-to-follow-up-on-github/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Fri, 11 Sep 2026 18:26:10 +0000", "snippet": "If you can write down how you do your work, you can automate it. Here's what I did to support GitHub's APAC marketing team. The post Marketing ops as code: Automating events from planning to follow-up on GitHub appeared first on The GitHub Blog .", "summary": "Tomoko Tanaka, who runs marketing for GitHub in Japan and Korea, automated her team's event workflows using GitHub Issues, labels, and Actions, with GitHub Copilot as the conversation layer for planning. An AGENTS.md runbook in plain Markdown guides Copilot to draft campaign names, emails, and questions, while the user approves every decision before Copilot files a structured GitHub Issue. When an event-setup label is applied, GitHub Actions duplicate the landing page, generate UTM-tagged URLs, and produce the invitation email automatically. A DRY_RUN repository variable lets the team rehearse the entire pipeline without touching external systems, and a cron-triggered workflow handles daily registrant screening. After the event, slash commands like /lead-upload and /event-report handle CRM uploads and reporting, each backed by SKILL.md files that read like runbooks. The approach only requires tools with a scriptable entry point, such as an API or CLI."}, {"id": "eng-02", "title": "GitHub availability report: August 2026", "url": "https://github.blog/news-insights/company-news/github-availability-report-august-2026/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Thu, 10 Sep 2026 02:05:17 +0000", "snippet": "In August, we experienced five incidents that resulted in degraded performance across GitHub services. The post GitHub availability report: August 2026 appeared first on The GitHub Blog .", "summary": "In August 2026, GitHub experienced five incidents that caused degraded performance across its services, with the most significant affecting GitHub Actions and another impacting issues, pull requests, and related APIs. The Actions incident on August 6 lasted over ten hours when a routine deployment reduced running capacity in one data center, pushing remaining sites past their limits and cascading into cache, DNS, and API errors. On August 17, a traffic peak pushed load balancers past their limits, amplifying through a latent retry bug and affecting roughly 29,000 organizations with failed or slow requests. Despite these challenges, GitHub made progress migrating workloads to Azure, achieving new highs in read traffic percentages and moving services off legacy databases. They also invested in capacity monitoring, autoscaling, load-shedding protections, and improved telemetry for faster incident detection going forward."}, {"id": "eng-03", "title": "GitHub Copilot app for Beginners: Using the diff, terminal, and browser", "url": "https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-using-the-diff-terminal-and-browser/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Thu, 10 Sep 2026 21:31:19 +0000", "snippet": "Checking agent-generated code usually means hopping between tabs. Learn how to view diffs, run terminal commands, and preview web apps side by side in the GitHub Copilot app. The post GitHub Copilot app for Beginners: Using the diff, terminal, and browser appeared first on The GitHub Blog .", "summary": "The GitHub Copilot app includes built-in diff, terminal, and browser panels that let developers review agent-generated code without switching between separate apps. The diff panel displays added, removed, or changed lines with color-coded highlighting, allowing users to accept changes, leave comments, or request modifications. The terminal panel enables running project commands directly within a session, either manually or through configurable scripts accessed via the Run button, with support for multiple open terminals. For user interface projects, the browser panel lets developers preview and test changes, and a Pick & Polish tool allows selecting specific elements to adjust with the agent. Once changes are approved, a pull request can be created directly from the app, completing the review process in one place. The article recommends asking three questions before accepting agent work: what changed, does it run, and does it actually work."}, {"id": "eng-04", "title": "Don't build tools for AI agents", "url": "https://seangoedecke.com/dont-build-tools-for-ai-agents/", "source": "Sean Goedecke", "source_kind": "blog", "published_at": "Sat, 12 Sep 2026 00:00:00 GMT", "snippet": "", "summary": "Don't build tools for AI agents"}]}, {"name": "papers", "label": "Papers", "intro": "Recent arXiv work across machine learning, programming languages, and applied mathematics — research that informs how engineers build.", "stories": [{"id": "pap-01", "title": "General Quantification of Covariate and Concept Shifts", "url": "http://arxiv.org/abs/2609.11918", "source": "Hongbo Chen", "source_kind": "paper", "published_at": "2026-09-10T17:57:52Z", "snippet": "Generalization under distribution shift remains a core challenge in modern machine learning, yet existing learning bound theory is limited to narrow, idealized settings and is non-estimable from samples. In this paper, we bridge the gap between theory and practical applications. We first show that existing definition of concept shift breaks when the source and target supports mismatch. Leveraging entropic optimal transport, we propose a key notion: $γ^{*}\\!$-concept shifts, and derive a general error bound unifying covariate and $γ^{*}\\!$-concept shifts, which applies to broad loss functions, label spaces, and stochastic labeling. We further develop estimators for these shifts with concentration guarantees, and the DataShifts algorithm, which can quantify distribution shifts and estimate t", "summary": "The paper addresses the challenge of generalization under distribution shift in machine learning, noting that existing learning bound theory is limited to narrow, idealized settings and cannot be estimated from samples. The authors demonstrate that the conventional definition of concept shift breaks when the source and target supports do not match. To address this, they introduce γ*-concept shifts, formulated through entropic optimal transport, and derive a general error bound that unifies covariate and γ*-concept shifts across broad loss functions, label spaces, and stochastic labeling. They also develop sample-based estimators for these shifts with concentration guarantees. Finally, the paper presents the DataShifts algorithm, a practical tool for quantifying distribution shifts and estimating the proposed error bound in most applications. The work was accepted at the 43rd International Conference on Machine Learning (ICML 2026)."}, {"id": "pap-02", "title": "GPU-CFR: 80x Faster Counterfactual Regret Minimization by Compiling the Game to Static Dataflow and CUDA Graph Replay", "url": "http://arxiv.org/abs/2609.11923", "source": "Boning Li", "source_kind": "paper", "published_at": "2026-09-10T17:58:14Z", "snippet": "Counterfactual regret minimization (CFR) is one of the few large numerical workloads that still runs faster on CPUs than on GPUs. Each iteration sweeps a game tree with up to billions of states in millions of small, interdependent gather and scatter steps issued through a generic tree interface. On a GPU every kernel finishes in microseconds, so kernel launches and framework dispatch dominate the run time, and prior GPU implementations have lost to optimized CPU code. We observe that for a fixed game, everything about a CFR iteration except the numerical values is known before the first iteration runs. We propose GPU-CFR, a compiler and runtime built on this observation. It compiles any game once into static dataflow: flat edge and information-set arrays, precomputed indices, and depth-lev", "summary": "Counterfactual regret minimization (CFR) typically runs faster on CPUs than on GPUs because kernel launches and framework dispatch dominate runtime when each iteration sweeps a game tree through millions of small, interdependent gather and scatter steps. The authors introduce GPU-CFR, which compiles any fixed game once into static dataflow consisting of flat edge and information-set arrays, precomputed indices, and depth-level batched passes, leaving only solver state to vary between iterations. Static chance folding, depth-level execution blocks, and a dual-lane reach buffer cut framework operations by up to 18.1x, while CUDA Graph Replay records the iteration once and replays it with a single graph launch. On one A100 across an eight-game suite spanning card, dice, and board games, GPU-CFR runs 29.8–80.4x faster than the fastest prior GPU CFR and 14–258x faster than the CPU implementation LiteEFG on the four largest games. The compiled representation alone is 2.2–51.1x faster than the GPU baseline on eight CPU threads without any accelerator, and tree construction plus graph capture pay for themselves within the first solve."}, {"id": "pap-03", "title": "Data Scarcity and Model Sparsity: Mixtures-of-Experts Overfit More to Repeated Data", "url": "http://arxiv.org/abs/2609.11917", "source": "Atindra Jha", "source_kind": "paper", "published_at": "2026-09-10T17:57:33Z", "snippet": "As the supply of human-written text is exhausted, it has become standard practice to repeat language model training data. Prior work has studied data repetition for densely activated Transformers, but the effects of data repetition remains largely unexplored for recently dominant sparse architectures such as Mixture-of-Experts (MoE), despite their increased compute efficiency. We vary data repetition rates across single- and multi-domain data mixes, and across MoE settings, including expert count and granularity. We consistently find, for models ranging from 80M to 1B active (8.5B total) parameters, that MoEs degrade more rapidly under data repetition. This effect increases with sparsity, dictated by total rather than active parameters. While 80M dense models can repeat data over 8x with m", "summary": "As supplies of human-written text dwindle, repeating language model training data has become standard practice. While prior work has examined data repetition in dense Transformers, the effects on sparse Mixture-of-Experts (MoE) architectures remain largely underexplored. Testing MoE models ranging from 80M to 1B active parameters across varying data repetition rates, expert counts, and granularities, researchers found that MoEs degrade more rapidly under data repetition than dense models, with the effect intensifying as sparsity increases and dictated by total rather than active parameters. Dense 80M models tolerate repetition over 8x with minimal degradation, while MoEs begin suffering at 4x and underperform dense models entirely after 32x. Some regularization methods like dropout and strong masking-based regularization can mitigate overfitting, enabling MoEs to outperform dense models even after 64x repetition, though no method fully recovers all-unique training data performance. Analysis further revealed that MoE routing stabilizes early in training, and expert specialization correlates with overfitting to repeated data."}, {"id": "pap-04", "title": "Generative Marketing Mix Modeling: A Causal Inference Framework Linking GEO and GEM to Business Impact", "url": "http://arxiv.org/abs/2609.11915", "source": "Masahiro Kato", "source_kind": "paper", "published_at": "2026-09-10T17:57:28Z", "snippet": "Generative artificial intelligence changes how firms reach customers, but standard marketing data do not record how often users see and notice a firm's name in generated answers. We develop Generative Marketing Mix Modeling (GMMM) to estimate the causal effects of Generative Engine Optimization (GEO) and Generative Engine Marketing (GEM). For GEO, GMMM combines repeated generated answers with question counts, shares of use across generative systems, and notice probabilities. For GEM, it combines records of sponsored placements with notice probabilities. GMMM compares expected business responses under alternative treatment sequences and establishes sufficient conditions for identifying the resulting effects. We investigate the empirical performance of the proposed method using simulated ans", "summary": "Kato, Honma, and Kato develop Generative Marketing Mix Modeling (GMMM), a causal inference framework designed to estimate the business impact of Generative Engine Optimization (GEO) and Generative Engine Marketing (GEM). The authors note that standard marketing data fail to capture how often users see or notice a firm's name within generative AI answers. To address this, GMMM combines repeated generated answers with question counts, share-of-use metrics across generative systems, and notice probabilities for GEO, while pairing sponsored placement records with notice probabilities for GEM. The framework compares expected business responses across alternative treatment sequences and establishes sufficient conditions for identifying causal effects. The authors test the method's empirical performance using simulated answers to product recommendation queries in both English and Japanese, submitted to arXiv in September 2026."}, {"id": "pap-05", "title": "Can Edge-Deployable Vision-Language Models Identify Species?", "url": "http://arxiv.org/abs/2609.11916", "source": "William Zhou", "source_kind": "paper", "published_at": "2026-09-10T17:57:32Z", "snippet": "Camera traps often run in the field on edge hardware with limited or no connectivity, making small, locally-deployable vision-language models (VLMs) -- not frontier-scale ones -- the practically relevant class to evaluate for species identification. We test whether models in this deployment-relevant 2--8B range carry genuine taxonomic knowledge, evaluating four such VLMs (Qwen3-VL 2B/4B/8B, Gemma3 4B) against the domain-specific specialist BioCLIP (300M parameters) on a 96-species task, comparing clean iNaturalist photographs against camera-trap imagery from 6 LILA.science collections, on two independently-sampled evaluation sets. All models identify species far above chance, but every model -- general-purpose or specialist -- degrades sharply on field imagery (domain gaps of 9.6--26.6 per", "summary": "The paper evaluates whether edge-deployable vision-language models (2-8B parameters) can identify species from camera-trap imagery. Testing Qwen3-VL 2B/4B/8B and Gemma3 4B against the domain specialist BioCLIP (300M parameters) on a 96-species task, the authors find that all models perform far above chance but degrade sharply on field imagery compared to clean photographs, with domain gaps of 9.6-26.6 percentage points. BioCLIP substantially outperforms every VLM tested by 33.2-59.2 percentage points despite its much smaller size, suggesting specialized training data outweighs model scale. Yet BioCLIP's domain gap (18.0 points) is statistically indistinguishable from the best VLM's (22.3 points), indicating the clean-to-field degradation reflects image-quality shifts rather than general-purpose-model weaknesses. Under open-set prompting, 5.9-9.6% of responses were syntactically valid but taxonomically nonexistent species names, with the fabrication ranking consistent across both evaluation sets."}]}, {"name": "tools", "label": "Tools", "intro": "Open-source releases trending on Hacker News — small focused tools and active projects worth a look.", "stories": [{"id": "tool-01", "title": "GrapheneOS' rewritten Messages app is released", "url": "https://github.com/GrapheneOS/Messaging/releases/tag/13", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-11T18:50:36+00:00", "snippet": "", "summary": "GrapheneOS has released version 13 of its Messaging app, which replaces the legacy interface with Jetpack Compose and Material 3 and rebuilds every screen. The update introduces a two-pane conversation layout for large screens, an adaptive app icon, and new onboarding covering SMS privacy and permissions. Conversation management now includes pinning, snoozing notifications, marking unread, archiving via swipe, and new status indicators. The app rebuilds message bubbles, the media picker, audio recording, photo viewer, and vCard viewer while adding attachment captions and a redesigned share picker with search. Security improvements include shared-content validation rejecting file URIs and private app files, restricted widget receivers, immutable pending intents, and allocation limits for parsing. The release also fixes numerous crashes, corrects notification handling for incoming SMS and blocked conversations, expands accessibility support, and updates platform dependencies to minSdk 36 and targetSdk 37."}, {"id": "tool-02", "title": "Litelm: LiteLLM Without the Bloat", "url": "https://github.com/kennethwolters/litelm", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-11T18:10:20+00:00", "snippet": "", "summary": "Litelm is a lightweight alternative to LiteLLM that extracts just the core call path—model routing, message translation, streaming, tool use, and embeddings—into roughly 2,900 lines of code with only two dependencies (openai and httpx). It deliberately omits features like proxy servers, caching, cost tracking, budgeting, and image generation, routing calls to 19 providers through a \"provider/model-name\" syntax that mirrors litellm's API. The library supports async variants, custom OpenAI-compatible endpoints, and maps provider errors to a unified exception hierarchy. Currently in alpha, litelm has 262 own tests passing and has been verified as a drop-in for DSPy across all seven execution paths. Compatibility with upstream LiteLLM was established through a maintainer audit of 360 core-path commits, with ported tests showing 75 passing cases and no remaining actionable failures."}, {"id": "tool-03", "title": "Show HN: Godot and Rust based multiplexer (terminal panes and more)", "url": "https://github.com/godot-pty/gpty", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-11T16:03:05+00:00", "snippet": "I wanted to share my side-project: gPTY. Started off as an idea to combine Godot and Rust in a project (two stacks I wanted to use more to learn more). The base inspiration was tmux - simply allow spawning multiple PTYs and then let the user grid/tile them how they see fit. But since we have the Godot game engine at our disposal, we can do some more interesting things, like add an FPS counter, and then subsequently also let people set their preferred FPS (the idea being the potential lower power draw if someone&#x27;s running it on a laptop on battery power vs someone running it on a desktop with high/native FPS). In its current state, with me using Oh-my-Pi a lot, it&#x27;s evolving into a terminal workspace that can be used for orchestrating autonomous AI agents by way of dogfooding (or ", "summary": "gPTY is a PTY foundation built on Godot and Rust that provides a tiling grid for panes including terminals, code viewers, and file trees. It exposes a JSON-RPC IPC socket, CLI, and MCP server so AI agents and automation tools can spawn panes, inject text, and observe terminal output without scraping TUIs. The terminal uses alacritty_terminal for full DEC STD 070 support with 16/256/true color, scrollback, and regex search, while a regex-based concept engine captures PTY output and routes it to adjacent panes without injecting shell input. Most of the codebase, including the Godot UI and the Rust GDExtension bridge, was LLM-generated. Cross-platform standalone binaries are published for Linux, macOS, and Windows with no toolchain required, and gPTY is licensed under GPLv3 with permissive exceptions for plugins and adapters."}, {"id": "tool-04", "title": "Stop making swap partitions—use swap files instead", "url": "https://gist.github.com/joshenders/c4960cec9c63a7b7d68ffa9543356c43", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-08T22:33:21+00:00", "snippet": "", "summary": "Linux distributions continue encouraging swap partitions during installation, but swap files offer identical performance and better flexibility. Swap files have matched swap partition performance for over 20 years while being easier to add, remove, modify, and extend after installation. To create a 4GB swap file, users can run `mkswap --size 4G --file /swapfile`, which requires util-linux 2.40 or newer. This command creates the file, sets mode 0600, and preallocates blocks using ftruncate and posix_fallocate, while version 2.41 adds nocow attribute support for Btrfs. The swap file can then be enabled with `swapon /swapfile` and made persistent by appending an entry to /etc/fstab."}]}, {"name": "discussions", "label": "Discussions", "intro": "Active threads from Hacker News and Lobsters — the meta-conversation around this week's tooling and craft.", "stories": [{"id": "disc-01", "title": "Shopify is moving from React Native back to Swift and Kotlin", "url": "https://shopify.engineering/back-to-native", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-10T14:09:31+00:00", "snippet": "", "summary": "Shopify is migrating its mobile apps from React Native back to Swift and Kotlin, driven by advances in LLM coding agents that have dramatically reduced the cost of building features twice. In 2020, the company chose React Native to avoid duplicating work, enable cross-platform developer contributions, and reduce feature parity efforts, but agents can now handle much of the implementation, translation, testing, and review work, undermining those original advantages. Native development keeps Shopify closer to platform capabilities and first-party tooling with fewer dependency layers. The Shop app was the first to ship as a fully native app, rebuilt in just 12 weeks, while the larger Shopify app with over 300 screens is underway. To support the migration, Shopify built Helix, a checkpoint-based system that ensures quality through tests, visual reviews, adversarial code reviewers, and human approval. They also created a CLI that lets agents iterate on business logic in milliseconds by running it headlessly on desktop, bypassing slow simulator-based testing."}, {"id": "disc-02", "title": "Don't let anyone take away your big box of cables", "url": "https://blog.jim-nielsen.com/2026/hands-off-my-cables/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-10T15:27:22+00:00", "snippet": "", "summary": "The author came across a social media post from Tyler Gaw who, after digging to the bottom of his \"Big Box of Cables,\" found two cables he'd needed that had been sitting unused there for over 10 years. Inspired by Gaw's advice to never let anyone take away one's big box of cables, the author decided to immortalize the message. He screenshotted the post, printed it in black and white on his Brother printer, cut it out, and taped it to the front of his own cable box—affectionately labeled \"FAMILY TECHNO BOX\" by his wife—using clear packing tape. Now, every time he opens the box to add another cable, the taped post serves as a reminder of why he keeps the collection and acts as a warning to family members considering throwing it out. The author hopes his children will one day discover the box in the attic and heed the advice printed on it."}, {"id": "disc-03", "title": "Rust is tier-1 language at Microsoft", "url": "https://rustfoundation.org/media/guest-post-rust-is-tier-1-language-at-microsoft/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-10T13:39:16+00:00", "snippet": "", "summary": "Rust has officially become a Tier-1 language at Microsoft, joining C++, C#, and TypeScript as one of the best-supported languages for internal development. This status gives Microsoft teams a paved path from local development to production, including secure toolchain builds, developer tooling, quality workflows, and platform integration. A key investment supporting this is rustc_codegen_utc, an alternative code generation backend that connects rustc to the MSVC backend, creating a unified code generation platform for Rust and C++ on Windows. This eliminates the need for parallel implementation of Windows-specific capabilities and reduces duplicated engineering as both languages evolve together. Production-ready since early 2026 and self-hosted since Rust 1.90, the backend is currently used by more than 100 Microsoft project repositories, with additional repositories adopting it weekly."}, {"id": "disc-04", "title": "A misalignment of AI in mathematics", "url": "https://mathandai.org/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-11T17:45:12+00:00", "snippet": "https://terrytao.wordpress.com/2026/09/11/a-severe-misalignm... https://www.economist.com/science-and-technology/2026/09/11/... , https://unwall.app/www.economist.com/science-and-technology/...", "summary": "Over recent months, large language models have dramatically improved in solving major mathematical problems, prompting AI companies to use these achievements as benchmarks. However, a group of prominent mathematicians warns that this pursuit is misaligned with the true goals of mathematics, which center on developing conceptual understanding, new methods, and the long-term cultivation of ideas through human discussion and careful writeups. They argue that the rapid mass production of true/false statements, often announced hastily without proper attribution, threatens the fertile ground from which genuine mathematical insight grows. The signatories emphasize that without human mathematicians to integrate and transmit AI-generated results, the crucial chain of intellectual development between researchers would be lost. They view these issues as part of a broader misalignment affecting all intellectual work, where AI may deliver final answers while undermining the deeper understanding those years of training were meant to foster. Ultimately, they stress that urgent decisions by AI developers, mathematicians, and society will determine whether these changes benefit or damage the field."}]}]}</script>
