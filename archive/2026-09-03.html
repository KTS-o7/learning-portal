<script type="application/json" id="digest-data">{"date": "2026-09-03", "label": "Thursday, September 3, 2026", "edition_tag": "vol-2-no-29", "total": 16, "prev_day": "2026-09-02", "next_day": null, "site": {"name": "Daily Byte", "tagline": "A byte-size daily digest for engineers who value depth over noise.", "base_url": "https://learn.shenthar.me", "repo": "https://github.com/KTS-o7/learning-portal"}, "sections": [{"name": "engineering", "label": "Engineering", "intro": "Independent voices and language-team notes.", "stories": [{"id": "eng-01", "title": "Goroutine Leak Profiles", "url": "https://go.dev/blog/goroutine-leak-profiles", "source": "Go Blog", "source_kind": "blog", "summary": "Go 1.27 introduces a goroutine leak profiler that detects goroutines permanently blocked on channels or primitives in the sync package. A leak occurs when a goroutine remains blocked under conditions that can never be satisfied, while existing tools like the goleak library and Go 1.25's synctest package only address testing scenarios, and traditional goroutine profiles cannot distinguish leaked goroutines from those temporarily blocked in high numbers by design. The new profiler is accessible through the runtime/pprof package as the goroutineleak type, or automatically through net/http/pprof at the /debug/pprof/goroutineleak endpoint. It produces precise results with little-to-no false positives by adapting the existing garbage collector, starting with unblocked goroutines as roots and incrementally adding blocked goroutines whose blocking primitives are reachable through live goroutines. The trade-off is that it only detects leaks involving channels and sync primitives, though this covers a large subset of real-world cases.", "published_at": "2026-09-02T00:00:00+00:00", "snippet": "Go 1.27 includes new goroutine leak profiles."}, {"id": "eng-02", "title": "Decoding the new AI lingo: Loops, harnesses, squads, hill climbing… oh my!", "url": "https://github.blog/ai-and-ml/decoding-the-new-ai-lingo-loops-harnesses-squads-hill-climbing-oh-my/", "source": "GitHub Blog", "source_kind": "blog", "summary": "New AI tools have introduced a flood of terminology into software development, with terms ranging from useful new patterns to rebranded existing concepts. Loop engineering refers to designing repeatable, scheduled systems around agents instead of issuing one-shot prompts, while Ralph loops are a brute-force variation where an agent continuously works until a task is complete. Squads describe groups of agents with specialized roles such as planning, vetting, implementing, testing, and reviewing, and fleets refer to parallel agents working simultaneously. A harness encompasses everything surrounding a model—tools, permissions, memory, and orchestration—with harness engineering focused on improving that surrounding system. Hill climbing describes the iterative process of improving agents and harnesses using evaluations and feedback. Finally, model accessibility falls into three categories: closed models accessed only via API, open weight models that expose parameters but not training data, and fully open source models where code, data, and methods are all available.", "published_at": "2026-09-02T21:00:00+00:00", "snippet": " From loop engineering to harnesses, squads, and open weights, the GitHub Podcast breaks down the AI terms showing up in developer conversations. \n The post  Decoding the new AI lingo: Loops, harnesses, squads, hill climbing&#8230; oh my!  appeared first on  The GitHub Blog . "}, {"id": "eng-03", "title": "How we make AI coding more cost efficient without sacrificing task quality", "url": "https://github.blog/ai-and-ml/github-copilot/how-we-make-ai-coding-more-cost-efficient-without-sacrificing-task-quality/", "source": "GitHub Blog", "source_kind": "blog", "summary": "GitHub Copilot optimized efficiency by focusing on complete task outcomes rather than simply shortening individual tool outputs, since concise responses can force agents to repeat work and increase total cost. Evaluations using RTK showed that compressing tool responses caused models to reopen original outputs or rerun commands, making tasks slower and more expensive globally. The team built a selective output compressor that preserves source-like output, reorganizes search results without dropping content, and compresses only repetitive noise from install, build, test, and lint commands. Removing unused line-number prefixes from the view tool reduced model-inference cost by roughly 5% offline and 3% online without affecting edit success. A meta-prompting loop shortened the task tool prompt by half, though an online experiment exposed a regression where agents ran sequentially until a regression test and a one-sentence fix restored parallelism. Finally, the harness delivers completed background work to agents without requiring an extra retrieval turn.", "published_at": "2026-09-02T18:00:00+00:00", "snippet": " Why shorter outputs can cost more, and how GitHub Copilot reduces wasted work across the complete coding task. \n The post  How we make AI coding more cost efficient without sacrificing task quality  appeared first on  The GitHub Blog . "}, {"id": "eng-04", "title": "Generic Methods", "url": "https://go.dev/blog/generic-methods", "source": "Go Blog", "source_kind": "blog", "summary": "Go 1.27 adds type parameters to concrete methods, allowing methods such as `(List[E]) Map[R any]` to be locally scoped and used in readable method chains. The change addresses a limitation of Go 1.18, which required package-level generic functions when a type’s operation needed different result types. A generic method must be instantiated explicitly or implicitly before it is called or converted to a function. Go does not add type parameters to interface methods, so a generic concrete method cannot satisfy an interface or participate in interface implementation. The article explains that generic interface methods would require producing code for all possible instantiations because interface values can be backed by separately defined types; boxing type arguments could reduce the number of instantiations but introduce indirect-call overhead.", "published_at": "2026-08-26T00:00:00+00:00", "snippet": "Go 1.27 adds generic methods—a highly desired language feature."}, {"id": "eng-05", "title": "Go 1.27 is released", "url": "https://go.dev/blog/go1.27", "source": "Go Blog", "source_kind": "blog", "summary": "Go 1.27 was released on 19 August 2026, introducing major enhancements across the language, toolchain, runtime, and standard library. The language now supports generic methods, allows struct literal keys to be any valid field selector for nested or embedded structs, and generalizes function type inference to all assignment contexts. Tool improvements include new modernizers in `go fix` (atomictypes, embedlit, slicesbackward, and unsafefuncs), package@version queries in `go doc`, and automatic consolidation of multiple require blocks by `go mod tidy`. Performance gains come from size-specialized memory allocation, which reduces small object allocation costs by up to 30%, and the goroutine leak profile in runtime/pprof is now generally available. Standard library additions include encoding/json/v2, crypto/mldsa for post-quantum signatures, native UUID support, experimental SIMD packages, and NewTestServer in net/http/httptest.", "published_at": "2026-08-19T00:00:00+00:00", "snippet": "Go 1.27 adds generic methods, encoding/json/v2 package, uuid package, faster memory allocation, goroutine leak profiles, and more."}]}, {"name": "papers", "label": "Papers", "intro": "Recent and relevant research from arXiv.", "stories": [{"id": "pap-01", "title": "Automated Vulnerability Injection in Smart Contracts Using Large Language Models", "url": "https://arxiv.org/abs/2609.02624v1", "source": "arXiv:cs.AI", "source_kind": "paper", "summary": "Assessing vulnerability detection tools for smart contracts requires datasets with known ground truth, which are scarce and difficult to build manually. The paper proposes an approach using Large Language Models to automatically inject vulnerabilities into Solidity smart contracts, targeting 49 vulnerability types from OpenSCV. Injected contracts are validated through a multi-step pipeline that checks compilation, execution, business logic, and the presence of the intended vulnerability. Applied to real-world contracts from SmartBugs, LLMs generated nearly 1,000 candidate variants, but after deduplication and validation, only 32 confirmed vulnerable contracts spanning 25 vulnerability types survived, yielding a 16.58% survival rate. Surviving contracts concentrated in structurally simpler targets and vulnerability types with localized syntactic patterns. The authors report challenges including LLM non-determinism and difficulty preserving contract semantics, and use the validated contracts to assess three static analyzers, revealing complementary yet incomplete coverage profiles, demonstrating feasibility while exposing limitations in scalability and diversity.", "published_at": "2026-09-02T14:03:09+00:00", "snippet": "Assessing vulnerability detection tools for smart contracts requires datasets with known ground truth, yet such datasets are scarce and difficult to build by hand. We propose an approach that uses Large Language Models (LLMs) to automatically inject vulnerabilities into Solidity smart contracts, and demonstrate it in a case study targeting 49 vulnerability types from OpenSCV. Injected contracts are validated through a multi-step pipeline checking compilation, execution, business logic, and the presence of the intended vulnerability. Applied to real-world contracts from SmartBugs, LLMs generate"}, {"id": "pap-02", "title": "Collective creativity in hybrid societies", "url": "https://arxiv.org/abs/2609.02620v1", "source": "arXiv:cs.AI", "source_kind": "paper", "summary": "Generative AI is changing how cultural artifacts are created and circulated, and researchers disagree about whether these tools enrich or impoverish culture. The authors argue this disagreement stems from conflating two distinct components of creativity: novelty, a property of single artifacts, and diversity, a property of populations. They contend that creativity in the context of generative AI is best understood as a property of hybrid collectives, or populations of interacting people and algorithms, rather than of individuals. While AI-assisted ideation reliably raises the novelty of individual output while narrowing aggregate diversity, this outcome is not inevitable, since humans and models search in complementary ways. Mixed groups can outperform and out-diversify groups of either kind alone, and machine-discovered solutions can enter human culture and persist there. What ultimately decides the outcome is composition: which agents are present, in what proportion, and how they are connected.", "published_at": "2026-09-02T13:59:08+00:00", "snippet": "Generative AI is changing how cultural artifacts are created and circulated, and with it our understanding of creativity itself. Researchers disagree about whether these tools enrich or impoverish culture, and we argue that much of that disagreement comes from conflating two distinct components of creativity: novelty, a property of single artifacts, and diversity, a property of populations. We argue further that creativity in the context of generative AI is best understood as a property of hybrid collectives, or populations of interacting people and algorithms, rather than of individuals. AI-a"}, {"id": "pap-03", "title": "Competitive Market Behavior of LLMs", "url": "https://arxiv.org/abs/2609.02580v1", "source": "arXiv:cs.AI", "source_kind": "paper", "summary": "Large language models (LLMs) are increasingly deployed as economic agents, yet their suitability for participating in market mechanisms designed for humans remains unclear. The authors address this question by replicating seminal economic experiments with LLM agents placed in a double auction environment, testing whether such markets deliver efficient resource allocation. They find that markets populated by LLM agents exhibit slower or no convergence toward market equilibrium, resulting in less efficient allocations than markets populated by humans. Analysis of individual trading decisions reveals substantial heterogeneity both across model families and market roles. A lexical analysis of Chain-of-Thought traces shows that the decision to execute a trade rather than continue incrementally adjusting prices is associated with a shift from strategic considerations toward urgency. The authors publicly release their testing framework to support future evaluations of LLM agents in economic settings.", "published_at": "2026-09-02T13:24:42+00:00", "snippet": "Large language models (LLMs) are increasingly deployed as economic agents, yet there is little evidence whether LLM agents are suited for participating in market mechanisms designed for humans, and whether these mechanisms deliver desired outcomes when faced with LLM agents. We address this question by replicating seminal economic experiments, replacing human subjects with LLM agents. We place agents in a double auction environment, which is a widely-used market mechanism. We check whether such a market is able to deliver an efficient allocation of resources, thereby testing a novel dimension "}, {"id": "pap-04", "title": "ProbeMatchDTI: Probe-Driven Multi-Scale Biochemical Pattern Matching for Drug-Target Interaction Prediction", "url": "https://arxiv.org/abs/2609.02549v1", "source": "arXiv:cs.AI", "source_kind": "paper", "summary": "ProbeMatchDTI is a pattern-probe-driven framework designed for drug-target interaction (DTI) prediction in AI-driven drug discovery. Existing biochemical representation learning approaches tend to favor strong molecular patterns during passive feature aggregation, suppressing weak but binding-relevant signals such as functional groups and residue-context patterns. To address this limitation, ProbeMatchDTI introduces two components: IterProbe, which retains contextual states across refinement depths and uses learnable probes to select them at each position before cross-entity matching, and BindingProbe, which characterizes drug-protein complementarity at both local biochemical-unit and whole-pair levels. Together, these modules jointly model fine-grained interactions and multi-scale biochemical correspondences while preserving weaker binding-relevant associations. Experiments show the framework achieves 2.0% and 0.5% higher AUC-ROC on BindingDB and DrugBank, respectively. The authors further integrate ProbeMatchDTI predictions with an evidence-guided downstream drug-discovery workflow for candidate refinement and validation planning.", "published_at": "2026-09-02T13:00:50+00:00", "snippet": "Drug-target interaction (DTI) prediction is an important task in AI-driven drug discovery. Although recent biochemical representation learning methods have improved DTI prediction, their passive feature aggregation tends to favor dominant molecular patterns while suppressing weak yet binding-relevant signals, such as functional groups and residue-context patterns, limiting the modeling of multi-scale biochemical correspondences. To address this issue, we propose ProbeMatchDTI, a pattern-probe-driven framework comprising IterProbe and BindingProbe. IterProbe explicitly retains contextual states"}, {"id": "pap-05", "title": "Learn from Whoever Is Right: Answer-Verified Multi-Teacher Distillation for Multi-Domain LLMs", "url": "https://arxiv.org/abs/2609.02548v1", "source": "arXiv:cs.AI", "source_kind": "paper", "summary": "Modern large language models often build strong capabilities in individual domains through reinforcement learning, but integrating those capabilities into a single deployable model is difficult. Existing multi-teacher approaches route each sample to a teacher based on domain labels, which can be unreliable since the matched teacher is not always correct on a given sample. The authors introduce Multi-Teacher Self-Distillation Policy Optimization (MT-SDPO), an on-policy distillation method that unifies several frozen teachers into one student model. MT-SDPO consists of three components: self-anchors that supervise a rollout using a correct rollout from its own group, answer-verified eligibility that only allows teachers to supervise samples when their answers pass a verifier, and privileged distillation that merges all verified feedback into a context read by an exponential moving average self-teacher but hidden from the student. Across five students from three model families, MT-SDPO lifted the weakest domain of Qwen3-8B by 14.79 points and narrowed its domain gap by 74.7%, demonstrating that verified reliability, not domain membership, should determine which teacher provides supervision.", "published_at": "2026-09-02T13:00:45+00:00", "snippet": "Modern large language models (LLMs) rely on reinforcement learning to build strong capabilities in individual domains, but integrating those capabilities into a single deployable model remains challenging. By routing each sample to the teacher whose domain matches it, existing approaches let a domain label decide which teacher provides supervision. However, domain expertise holds only on average: the matched teacher is not always correct on a given sample, while a teacher from another domain sometimes is. The reliable teacher therefore has to be identified per sample, not per domain. In this p"}]}, {"name": "tools", "label": "Tools", "intro": "HN-launched repos and useful new projects.", "stories": [{"id": "too-01", "title": "Fable 5.1 World Modeling", "url": "https://github.com/PhiloLabs/fable51-worlds", "source": "Hacker News", "source_kind": "repo", "summary": "", "published_at": "2026-09-02T19:49:01+00:00", "snippet": ""}, {"id": "too-02", "title": "WebLLM: high-performance in-browser LLM inference engine", "url": "https://github.com/mlc-ai/web-llm", "source": "Hacker News", "source_kind": "repo", "summary": "WebLLM is a high-performance in-browser LLM inference engine that brings language model inference directly to web browsers with WebGPU hardware acceleration, requiring no server-side support. It is fully compatible with the OpenAI API, supporting features such as streaming, JSON-mode structured generation, and logit-level control. The engine natively supports a wide range of model families, including Llama 3, Phi 3, Gemma, Mistral, and Qwen, with options for integrating custom models in MLC format. Developers can install WebLLM via npm, yarn, or pnpm, or import it directly through a CDN for use on platforms like JSFiddle and CodePen. The engine is created using CreateMLCEngine, which loads models asynchronously and supports multiple cache backends including the browser Cache API, IndexedDB, Origin Private File System, and an experimental cross-origin storage extension. Advanced usage includes Web Worker and Service Worker support for offloading computation, as well as Chrome extension integration.", "published_at": "2026-09-02T14:02:35+00:00", "snippet": ""}]}, {"name": "discussions", "label": "Discussions", "intro": "HN and Lobsters threads worth your scroll.", "stories": [{"id": "disc-01", "title": "Normalized Fascism in Open Source: $12 Million Given to DHH", "url": "https://brennan.day/normalized-fascism-in-open-source-12-million-given-to-dhh/", "source": "Lobsters", "source_kind": "discussion", "summary": "Open source has increasingly become a culture welcoming far-right ideology, with millions of dollars backing projects and figures who espouse bigotry. David Heinemeier Hansson, creator of Ruby on Rails and a Shopify board member, described a London march calling for the \"remigration\" of non-white residents as \"heartwarming\" and recently launched the Omacom Foundation to fund his Linux distribution, Omarchy. Twelve executives, including the CEOs of Shopify, Stripe, Dell, Cloudflare, Block, Dropbox, and Coinbase, pledged $1 million each as Founding Patrons, while companies like 1Password and 37signals contribute $100,000 annually for three years. Similar patterns appear across other projects: Ladybird browser founder Andreas Kling refused gender-neutral documentation as \"personal politics,\" Hyprland developer Vaxry was banned for enabling harassment of trans community members, and Brave CEO Brendan Eich's company gave payments to Kiwi Farms. The author calls for vocal opposition and aggressive boycotts of these companies.", "published_at": "2026-09-02T01:31:38-05:00", "snippet": "  Comments  "}, {"id": "disc-02", "title": "Dependent if expressions without dependent types", "url": "https://haskellforall.com/2026/09/dependent-if-expressions", "source": "Lobsters", "source_kind": "discussion", "summary": "The article presents a folklore trick for implementing dependent if expressions without dependent types, working in any language with Hindley-Milner type inference. In Haskell, it requires only the RebindableSyntax extension. The technique uses Church encoding, where booleans are represented as functions accepting two arguments representing the \"then\" and \"else\" branches and returning one of them. By removing type signatures and the RankNTypes extension, the compiler infers more general types where the result type can vary based on which boolean value is passed in. This allows the Bool type to be a function whose arguments and result can all have different types, tracking information flow at the type level. Notably, mixing true and false together in a list causes the type to degrade gracefully, requiring the same type for both branches rather than allowing different types.", "published_at": "2026-09-02T12:52:36-05:00", "snippet": "  Comments  "}, {"id": "disc-03", "title": "Static Allocation, Constant Work", "url": "https://matklad.github.io/2026/09/02/static-allocation-constant-work.html", "source": "Lobsters", "source_kind": "discussion", "summary": "The article advocates for two related systems programming principles: static allocation, which means pre-allocating a maximum number of objects at startup rather than dynamically allocating at runtime, and constant work, which means operating on a fixed set of slots rather than tracking live items separately. Under static allocation, the system fails fast at startup if insufficient memory exists, but avoids catastrophic failures like OOM kills during overload. Under constant work, all slots are initialized to a neutral reserved state and orders merely circulate through them, with explicit state transition functions and runtime assertions verified by deterministic simulation testing. Full iteration over all slots is preferred over iterating only active indexes because it is easier for the compiler to vectorize and for the CPU cache to prefetch. Together, these principles ensure P100 latency stays flat regardless of load and that performance issues surface during rollout rather than during peak traffic. The author notes these are useful techniques, not universal solutions.", "published_at": "2026-09-02T13:19:13-05:00", "snippet": "  Comments  "}, {"id": "disc-04", "title": "Implementing FMA and finding bugs in C and Rust standard libraries", "url": "https://shnatsel.github.io/implementing-fma-finding-bugs-in-std/", "source": "Lobsters", "source_kind": "discussion", "summary": "While implementing FMA for fearless_simd, the author discovered his translation of a formally verified algorithm mishandled subnormal values, producing incorrect results. He traced the same bug to Rust's standard library and musl libc, where a FreeBSD implementation from 2005-2011 had been copy-pasted. Fixing fearless_simd was straightforward, but the standard library fix is more complex because it must also correctly set floating-point status flags. Along the way, the author also uncovered a separate rustc ABI bug for the f128 type on 32-bit ARM. As of writing, fearless_simd and the rustc bug are fixed, but his Rust standard library pull request still awaits review and musl has not merged a fix despite active discussion. The bug only affects platforms without hardware FMA, such as old Intel CPUs lacking AVX2, Hygon x86 chips, 32-bit ARM, and various embedded systems, where it causes rare results to be off by one least significant bit.", "published_at": "2026-09-02T11:19:44-05:00", "snippet": "  Comments  "}]}]}</script>
