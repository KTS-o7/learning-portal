h three tracks (community, maintenance, collectively funded features), all landing in one shared codebase with no early access.", "why": "EDG, a production C++ front-end used for 30 years, is now open source under the C++ Alliance.", "takeaway": "A battle-tested C++ front-end with three decades of history and unique compiler-emulation capabilities is now open for community development.", "debate": "Commenters note EDG the company appears to be winding down, suggesting the open-sourcing is a stewardship change rather than a growth story; others speculate about using it for transpiling C++ to other languages.", "level": "advanced", "minutes": 3, "thread_url": "https://news.ycombinator.com/item?id=49913192"}, {"id": "disc-02", "title": "What TLA+ can and can't check", "url": "https://buttondown.com/hillelwayne/archive/what-tla-can-and-cant-check/", "source": "Hacker News", "source_kind": "discussion", "published_at": "2026-09-30T13:57:06Z", "summary": "TLA+ verifies invariants, action properties, and liveness across single behaviors. It cannot natively express multi-step properties, real time, floating point, reachability ('is P possible'), or hyperproperties that compare behaviors (like security or statistical guarantees). Workarounds exist but inflate complexity.", "why": "Hype claims TLA+ will fix LLM-generated bugs, but it can't express many properties people assume it can.", "takeaway": "Formal methods only verify what you can phrase as logic over single behaviors; many real concerns stay out of reach.", "debate": "Commenters mention Quint as better tooling, note TLA+'s weak-memory modeling gaps, criticize its awkward syntax, and argue no formal method can rescue probabilistic code generators.", "level": "advanced", "minutes": 8, "thread_url": "https://news.ycombinator.com/item?id=49909056"}]}, {"name": "offbeat", "label": "Off the clock", "intro": "An astronomer following a 75-cent accounting anomaly uncovered a Soviet spy operating inside a national research lab
