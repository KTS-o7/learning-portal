<script type="application/json" id="digest-data">{"date": "2026-09-19", "label": "Saturday, September 19, 2026", "edition_tag": "vol-2-no-44", "total": 17, "prev_day": "2026-09-18", "next_day": null, "site": {"name": "Daily Byte", "tagline": "A byte-size daily digest for engineers who value depth over noise.", "base_url": "https://learn.shenthar.me", "repo": "https://github.com/KTS-o7/learning-portal"}, "sections": [{"name": "engineering", "label": "Engineering", "intro": "Independent engineering blogs lead with concrete trade-offs and post-mortems rather than product launches.", "stories": [{"id": "eng-01", "title": "Migrating the GitHub Copilot runtime to Rust, using Copilot", "url": "https://github.blog/ai-and-ml/generative-ai/migrating-the-github-copilot-runtime-to-rust-using-copilot/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Thu, 17 Sep 2026 00:26:43 +0000", "snippet": "A rewrite this size wasn't affordable before agents. Here's what porting the Copilot agent runtime to 800,000 lines of production Rust actually took. The post Migrating the GitHub Copilot runtime to Rust, using Copilot appeared first on The GitHub Blog .", "summary": "GitHub rewrote its Copilot agent runtime from TypeScript on Node.js into more than 800,000 lines of production Rust, a task primarily completed by a single developer over a few months with most code written by AI agents across 128 pull requests that shipped incrementally. The runtime, which backs the Copilot CLI, Copilot app, SDK, VS Code, Visual Studio, and other Microsoft and GitHub products, had originally been intertwined with the terminal UI and was later layered as an SDK on top of a headless CLI process, forcing out-of-process communication and roughly 100 MB of V8 overhead per client. Rust was chosen to enable in-process embedding via a C ABI, supporting six SDK language versions (C#, TypeScript, Python, Rust, Go, Java), while delivering lower startup time, memory use, and better scalability. Although the initial TypeScript estimate was 130,000 lines, approximately 430,000 lines of production TypeScript ultimately passed through the port alongside parallel incoming work. The migration improved runtime performance by orders of magnitude while the team continued expanding its capabilities."}, {"id": "eng-02", "title": "Should you read the code, is RAG dead, and did Skills kill MCP?", "url": "https://github.blog/ai-and-ml/should-you-read-the-code-is-rag-dead-and-did-skills-kill-mcp/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Fri, 18 Sep 2026 15:00:00 +0000", "snippet": "We dive into these questions and other AI hot takes on the latest episode of the GitHub Podcast. The post Should you read the code, is RAG dead, and did Skills kill MCP? appeared first on The GitHub Blog .", "summary": "A GitHub Podcast episode explores five AI hot takes by examining the assumptions behind them. Reviewing AI-generated code remains essential, but the level of attention should match the risk rather than treating every change the same way. Hiring managers increasingly value judgment about when and how to use AI over blanket adoption or refusal, with fluency in these tools becoming part of the craft. Skills and the Model Context Protocol (MCP) solve different problems and work together, with MCP providing standardized interfaces and skills offering project-specific context and process guidance. Retrieval-augmented generation (RAG) remains valuable for grounding AI responses in relevant external information like documentation and internal knowledge. Finally, codebases that confuse AI models often confuse human teammates too, making maintainability, clear structure, and readable abstractions more important than ever."}, {"id": "eng-03", "title": "Marketing ops as code: Automating events from planning to follow-up on GitHub", "url": "https://github.blog/ai-and-ml/github-copilot/marketing-ops-as-code-automating-events-from-planning-to-follow-up-on-github/", "source": "GitHub Blog", "source_kind": "blog", "published_at": "Fri, 11 Sep 2026 18:26:10 +0000", "snippet": "If you can write down how you do your work, you can automate it. Here's what I did to support GitHub's APAC marketing team. The post Marketing ops as code: Automating events from planning to follow-up on GitHub appeared first on The GitHub Blog .", "summary": "Tomoko Tanaka, who runs marketing for GitHub in Japan and Korea, automated her team's event workflows by converting written runbooks into GitHub Copilot conversations and GitHub Actions workflows. The system relies on three GitHub primitives: issue forms capture event details, labels trigger automations, and Actions execute the work. Planning begins with a conversation guided by an AGENTS.md runbook file, which helps draft campaign names and invitation emails before filing a structured GitHub Issue. Applying an \"event-setup\" label launches a workflow that duplicates event landing pages, generates UTM links, produces invitation emails, and files requests with relevant teams. A DRY_RUN repository variable allows the team to rehearse changes without affecting external systems, while daily cron jobs screen registrants and slash commands like /lead-upload and /event-report handle post-event tasks, all defined as SKILL.md procedures."}, {"id": "eng-04", "title": "Two techniques for working with System One models", "url": "https://seangoedecke.com/two-techniques-for-working-with-system-one-models/", "source": "Sean Goedecke", "source_kind": "blog", "published_at": "Fri, 18 Sep 2026 00:00:00 GMT", "snippet": "", "summary": "Two techniques for working with System One models"}]}, {"name": "papers", "label": "Papers", "intro": "Recent arXiv work across machine learning, programming languages, and applied mathematics — research that informs how engineers build.", "stories": [{"id": "pap-01", "title": "Coding Agents with an Obstacle-Aware Harness for Safe Robot Manipulation", "url": "http://arxiv.org/abs/2609.20822", "source": "Bingxin Xu", "source_kind": "paper", "published_at": "2026-09-17T17:59:58Z", "snippet": "Coding agents have emerged as a promising paradigm for robot manipulation: a language model writes the robot controller as a program, and agents built in this way now operate robots without robot-specific training.Whether this paradigm is also safe, however, has not been asked. We evaluate coding agent under a safety constraint, where each task pairs a manipulation goal with an obstacle the robot must not touch. The agent pursues the goal but collides with the obstacle in most cases, treating task completion as its sole objective while neglecting safety. The agent reasons about the obstacle in its traces, and the prompt already forbids touching it, so neither perception nor instruction is at fault; the fault lies in the planning, where the stated constraint never becomes a priority. By dec", "summary": "The paper investigates whether coding agents—language models that write robot controllers as programs—can operate safely when tasks pair manipulation goals with obstacles that must not be touched. The authors find that such agents typically collide with obstacles because they treat task completion as their sole objective and never elevate the safety constraint to a true priority, even when they reason about the obstacle in their traces and the prompt forbids contact. By decomposing manipulation into a route phase and a contact-rich moment, they locate the failure in planning and contact execution. To address this, they introduce SafeHarness, which equips the model with two obstacle-aware harnesses: one for route planning using bounding boxes and waypoint-based candidate routes that are verified and replanned as needed, and another for contact execution that selects contact positions to avoid the obstacle. SafeHarness achieves 71.9% task success and 87.5% collision avoidance, surpassing prior state-of-the-art by 6.5% and 27.0% respectively."}, {"id": "pap-02", "title": "Embedding Models Measure in Peculiar Ways", "url": "http://arxiv.org/abs/2609.20821", "source": "Juri Opitz", "source_kind": "paper", "published_at": "2026-09-17T17:59:54Z", "snippet": "Embedding spaces define notions of semantic similarity and distance. We study whether those embeddings reflect physical measurements of mass, distance, time and volume, which admit a unique, objective notion of semantic equivalence and distance. We find that physical measurement is only weakly modeled in the embedding space, and that instead quite peculiar measurement patterns can be observed. Further analysis indicates that embedding representations of physical measurements are strongly influenced by superficial string similarity, and recalibration of similarity does not substantially improve the alignment.", "summary": "This paper investigates whether embedding models accurately reflect physical measurements of mass, distance, time, and volume, which have unique and objective notions of semantic equivalence and distance. The authors find that physical measurement is only weakly modeled in embedding spaces, with quite peculiar measurement patterns emerging instead. Further analysis reveals that embedding representations of physical measurements are strongly influenced by superficial string similarity rather than actual physical properties. Attempts at recalibrating similarity do not substantially improve the alignment between embeddings and true physical measurements. The findings suggest that embedding models fail to reliably encode objective physical relationships."}, {"id": "pap-03", "title": "Workspace Models: Lightweight Robotic Memory via Saliency-Driven Supervision", "url": "http://arxiv.org/abs/2609.20820", "source": "Nitish Dashora", "source_kind": "paper", "published_at": "2026-09-17T17:59:53Z", "snippet": "Complex robotic manipulation tasks frequently require a long-term memory of past events and actions. As conditioning on full histories renders policies prone to spurious correlations and degrades performance, many approaches to policy memory involve compressing historical information through expensive VLM queries in-the-loop to process only task-salient information. In this paper, we propose an alternative approach in which computationally intensive VLM queries are made during train-time to learn a lightweight latent memory that can be efficiently queried at deployment time. Our representation, which we call the \\textbf{workspace token}, is trained by (1) using a VLM to identify current and historical information necessary for completing a task, then (2) distilling these into the workspace", "summary": "Complex robotic manipulation tasks often require long-term memory of past events, but conditioning policies on full histories can introduce spurious correlations that hurt performance. While many existing methods rely on expensive vision-language model queries during deployment to filter for task-salient information, this paper proposes shifting those computationally intensive VLM calls to training time instead. The authors introduce the \"workspace token,\" a lightweight latent memory representation trained in two stages: a VLM first identifies the current and historical information needed to complete a task, then this knowledge is distilled into the token via a set-reconstruction decoder loss. In both simulation and hardware experiments, the workspace token serves as a drop-in replacement for observations at deployment, enabling policies to solve memory-intensive tasks without in-the-loop VLM reasoning. Notably, the authors find that workspace tokens are not only more lightweight than full observation histories but also lead to better policy performance."}, {"id": "pap-04", "title": "FAMOS: Feed-Forward 3D Articulation Modeling from Sparse Observations", "url": "http://arxiv.org/abs/2609.20817", "source": "Kevin Qu", "source_kind": "paper", "published_at": "2026-09-17T17:59:40Z", "snippet": "Modeling articulated objects from sparse monocular views is challenging because each observation reveals only partial geometry and motion evidence. Most feed-forward methods infer articulation from a single observation and therefore rely heavily on learned category-level shape priors. We present FAMOS, a feed-forward model that predicts movable-part segmentation and joint parameters from a sparse, unordered set of partial point clouds. Our model jointly reasons over multiple observations and naturally supports a variable number of inputs, including a single view. To aggregate articulation cues across observations, we introduce a Multi-state Articulation Transformer with alternating state-wise and global attention. We further propose an observed articulation span objective that supervises t", "summary": "FAMOS is a feed-forward model that predicts movable-part segmentation and joint parameters from sparse, unordered sets of partial point clouds to model articulated objects. Unlike existing feed-forward methods that rely on a single observation and category-level shape priors, the model jointly reasons over multiple observations while naturally supporting a variable number of inputs, including single views. The authors introduce a Multi-state Articulation Transformer with alternating state-wise and global attention to aggregate articulation cues across observations. They also propose an observed articulation span objective that supervises the motion range each part exhibits across the input observations. To address limited dataset scale and diversity, they developed a procedural data generator that synthesizes self-annotated assets during training. Experiments on PartNet-Mobility, ACD, and ArtiCraft-10K demonstrate consistent improvements over both feed-forward and optimization-based baselines."}, {"id": "pap-05", "title": "Paint-Anything: Unified Any-Color Control for Image Generation and Editing", "url": "http://arxiv.org/abs/2609.20816", "source": "Ji Xie", "source_kind": "paper", "published_at": "2026-09-17T17:59:30Z", "snippet": "Professional design requires any-color control: the ability to specify an object's target color with any 24-bit hex value for image generation and editing. Prior work has explored color generation, editing, and colorization, but often relies on dedicated color representations or specialized inference procedures. Advances in large language models offer a simpler starting point: even compact models can associate hex values with color semantics. We present Paint-Anything, which learns a shared hex-prompt interface for generation and editing through object-level color supervision. We develop a data pipeline that constructs Paint-500K from real images through object grounding, perceptual color labeling, and editing-pair synthesis. Since shadows make real-image labels only approximate colors, we", "summary": "Paint-Anything, developed by Ji Xie, Dewei Zhou, Xinyu Huang, Zhennan Chen, and Xun Wang, enables any-color control in image generation and editing by letting users specify object target colors with 24-bit hex values. The method learns a shared hex-prompt interface for both tasks through object-level color supervision, avoiding dedicated color representations used in prior work. To train the system, the authors construct the Paint-500K dataset from real images via object grounding, perceptual color labeling, and editing-pair synthesis. Because shadows make real-image labels only approximate, they add pure-color anchors whose pixels exactly match their paired hex values, applied only at high-noise timesteps. The paper also introduces ACBench, with ACBench-T2I and ACBench-Edit subsets, to measure object-level hex color fidelity. On FLUX.2-4B, Paint-Anything improves ACBench-T2I and ACBench-Edit scores by 85.3% and 28.3% respectively over the base model and achieves the highest average CompColor score among compared methods."}]}, {"name": "tools", "label": "Tools", "intro": "Open-source releases trending on Hacker News — small focused tools and active projects worth a look.", "stories": [{"id": "tool-01", "title": "Jemalloc 5.4.0", "url": "https://github.com/jemalloc/jemalloc/releases/tag/5.4.0", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-18T04:20:24+00:00", "snippet": "", "summary": "Jemalloc 5.4.0 was released with over 160 commits focused on technical debt cleanup, including refactorings, bug fixes, test coverage improvements, option cleanups, and portability enhancements. New features include EXTENT_ALLOC_FLAG_PINNED for marking non-reclaimable mappings, new mallctl interfaces for reporting pinned-memory usage and mutex statistics, the ability to resume per-CPU arena selection via thread.arena, better alignment between human-readable and JSON malloc statistics, and the replacement of the runtime experimental_infallible_new option with the compile-time --enable-cxx-infallible-new option. Incompatible changes adapt tcache fill and retention targets per bin to demand between GC events and remove seven legacy non-experimental controls. Notable bug fixes preserve errno across free functions, fix numeric overflow checks in size classes, accept NULL in free_sized and free_aligned_sized, resolve TSD lifecycle edge cases, and address a potential arena_reset deadlock. The release also modularizes jemalloc's front end, simplifies ctl dispatch, introduces an OS abstraction layer, and provides portability improvements across macOS, MinGW, and GCC 16."}, {"id": "tool-02", "title": "We made Playwright 2x faster and 80% more token efficient", "url": "https://github.com/browserbase/stagehand", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-18T16:25:23+00:00", "snippet": "", "summary": "Stagehand is an SDK designed for AI agents to extract data and interact with websites, available in TypeScript, Python, and Go. It builds on Playwright-style APIs like goto, click, locator, and screenshot while adding agent-focused capabilities: observe() returns real selectors so credentials never reach the model, act() self-heals when sites redesign, and extract() returns schema-validated data. Stagehand runs as a browser extension to reduce latency and offers features like WebMCP support, clipboard access, batch commands, and deep locators for nested iframes and closed Shadow DOMs. When pointed at the hosted Browserbase service, it executes 2x faster than Playwright cloud equivalents, with a Model Gateway that selects the cheapest model per action and server-side caching to avoid redundant token usage. The team also provides an MCP server for clients like Claude and Cursor, plus lightweight Search and Fetch endpoints for accessing web content without a full browser session."}, {"id": "tool-03", "title": "Show HN: An e-ink frame that hears birds and draws them as 1800s illustrations", "url": "https://github.com/arnegiacomo/fugleramme", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-15T12:31:10+00:00", "snippet": "See also: Avian Visitors - https://news.ycombinator.com/item?id=48343424 - May 2026 (20 comments)", "summary": "See also: Avian Visitors - https://news.ycombinator.com/item?id=48343424 - May 2026 (20 comments)"}, {"id": "tool-04", "title": "Hister: A private search engine for the pages you visit and the files you keep", "url": "https://github.com/asciimoo/hister", "source": "Hacker News", "source_kind": "repo", "published_at": "2026-09-17T16:25:37+00:00", "snippet": "", "summary": "Hister: A private search engine for the pages you visit and the files you keep"}]}, {"name": "discussions", "label": "Discussions", "intro": "Active threads from Hacker News and Lobsters — the meta-conversation around this week's tooling and craft.", "stories": [{"id": "disc-01", "title": "Microsoft exec called AI scraping 'the largest theft of labor in human history'", "url": "https://techcrunch.com/2026/09/17/microsoft-exec-called-ai-scraping-the-largest-theft-of-labor-in-human-history-new-unredacted-filings-reveal/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-18T09:45:07+00:00", "snippet": "", "summary": "Newly unredacted filings in The New York Times' copyright lawsuit against OpenAI and Microsoft reveal internal admissions that AI scraping amounts to theft and that AI products threaten publishers' livelihoods. Microsoft Applied Science director Brent Hecht called it \"the largest theft of labor in human history\" in a January 2023 memo, while OpenAI's Nick Turley described chatbots as an \"existential threat\" to publishers that are \"largely substitutive.\" Microsoft data shows its Copilot answer engine reduced click-through rates to the NYT domain by as much as 93%, described internally as a \"doom loop.\" Microsoft CEO Satya Nadella testified that paywalled content should be licensed for training or grounding. The filings detail how the companies scraped content by bypassing paywalls, including an exchange where OpenAI's Greg Brockman replied \"ah nice\" to a paywall hack, and stripped copyright notices from training data before use."}, {"id": "disc-02", "title": "I don't like passkeys", "url": "https://hawksley.dev/blog/i-dont-like-passkeys", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-18T12:06:50+00:00", "snippet": "", "summary": "Computer science student Ethan Hawksley argues that while passkeys offer strong protection against phishing and data breaches, they are not yet mature enough for individual users due to risks of permanent lockout, automated account bans, and device loss. Hardware keys cannot back up passkeys, requiring users to purchase multiple keys per site, with limits of 25 to 300 accounts per device. Synced passkeys tied to Apple or Google accounts create a single point of failure, since an account ban could irreversibly lock users out of all third-party accounts. Third-party password managers like Bitwarden and KeePassXC still face fragmented platform support and inconsistent autofill experiences. For everyday users, the author recommends randomly generated passwords stored in a third-party password manager combined with an independent TOTP app, which he says provides better control and flexibility than current passkey implementations."}, {"id": "disc-03", "title": "Astra for Law", "url": "https://openai.com/index/astra-for-law/", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-17T20:17:48+00:00", "snippet": "", "summary": "Astra for Law"}, {"id": "disc-04", "title": "Fujitsu launches made-in-Japan next-generation CPU FUJITSU-MONAKA", "url": "https://global.fujitsu/en-global/pr/news/2026/09/14-02", "source": "Hacker News", "source_kind": "blog", "published_at": "2026-09-15T17:28:38+00:00", "snippet": "", "summary": "Fujitsu launches made-in-Japan next-generation CPU FUJITSU-MONAKA"}]}]}</script>
