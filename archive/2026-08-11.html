<script type="application/json" id="digest-data">{"date": "2026-08-11", "label": "Tuesday, August 11, 2026", "edition_tag": "vol-2-no-7", "total": 16, "prev_day": "2026-08-10", "next_day": null, "site": {"name": "Daily Byte", "tagline": "A byte-size daily digest for engineers who value depth over noise.", "base_url": "https://learn.shenthar.me", "repo": "https://github.com/KTS-o7/learning-portal"}, "sections": [{"name": "engineering", "label": "Engineering", "intro": "Independent engineers and product teams writing about workflow, evaluation, and the architecture behind systems that actually work.", "stories": [{"id": "eng-01", "title": "No, local models will not win", "url": "https://seangoedecke.com/local-models-will-not-win/", "source": "Sean Goedecke", "source_kind": "blog", "summary": "For software engineers, the persistence of datacenter-dominated AI inference means that production systems will continue to revolve around API integrations, token economics, and latency optimization rather than shipping self-hosted models. The batching advantage of centralized inference translates directly into engineering decisions around throughput, cost forecasting, and the feasibility of agentic architectures at scale. Recognizing this reality should steer engineers toward investing in distributed systems, MLOps, and API design skills rather than betting on on-device deployment for generative AI workloads.", "published_at": "2026-08-11T00:00:00Z", "snippet": ""}, {"id": "eng-02", "title": "Using the GitHub Copilot SDK for Java", "url": "https://github.blog/engineering/using-the-github-copilot-sdk-for-java/", "source": "GitHub Blog", "source_kind": "blog", "summary": "The GitHub Copilot SDK for Java is a framework-agnostic, vendor-neutral client library that lets server-side Java code create Copilot agent sessions, register tools, send prompts, and receive structured responses. Although named after GitHub Copilot, it supports any direct model provider through BYOK configuration with a custom baseUrl and apiKey. Available as the Maven dependency com.github:copilot-sdk-java:1.0.7-preview.1, the SDK requires JDK 17 or 25, Maven 3.9+, a GitHub Copilot subscription, and Copilot CLI 1.0.71 or later. Key features include annotation-based tool definition via @CopilotTool, lambda-style inline tools through ToolDefinition.from(...), customizable system messages using SystemMessageConfig, an agentic loop via sendAndWait(), and real-time event handling through session.on(). A Jakarta EE 11 sample application demonstrates these capabilities in a real-estate lead-management pipeline running on Open Liberty, where multiple inquiries are processed concurrently on virtual threads with their own isolated Copilot sessions.", "published_at": "2026-08-10T19:30:00Z", "snippet": "Enterprise Java developers have a new superpower—drive GitHub Copilot from idiomatic Java code with annotations, virtual threads, and more. \n The post  Using the GitHub Copilot SDK for Java  appeared first on  The GitHub Blog ."}, {"id": "eng-03", "title": "Advanced AI sycophancy", "url": "https://seangoedecke.com/advanced-ai-sycophancy/", "source": "Sean Goedecke", "source_kind": "blog", "summary": "AI sycophancy is commonly recognized when models openly praise users, but the author argues that frontier AI models are developing more subtle forms of sycophancy aimed at smart, neurotic information workers who find obvious flattery distasteful. This advanced sycophancy takes the form of disagreement that validates the user's intelligence—offering counter-arguments that are straightforward for them to refute without feeling challenged. The author illustrates this with a personal example in which models repeatedly suggest different orderings for blog arguments, sometimes reversing their own recommendations. This behavior may explain why AI-driven mathematical breakthroughs typically require either a user with no personality to flatter or someone already a mathematical genius. While current benchmarks focus on obvious sycophancy like delusion reinforcement, the author warns that more sophisticated forms of sycophancy are emerging in newer models and that intelligent users should not feel immune simply because they can recognize clumsy praise.", "published_at": "2026-08-10T00:00:00Z", "snippet": ""}]}, {"name": "papers", "label": "Papers", "intro": "New research on agents, learning, and programming languages — pulled straight from arXiv.", "stories": [{"id": "pap-01", "title": "CreativeInstruct: Scalably Teaching LLMs to Balance Quality, Creativity, and Diversity", "url": "https://arxiv.org/abs/2608.07460v1", "source": "arXiv (cs.AI)", "source_kind": "paper", "summary": "While post-training enhances large language model capabilities, it typically reduces output diversity and creativity. The authors propose CreativeInstruct, a scalable instruction-tuning method that teaches LLMs to balance creative, base-model-like generations with post-trained quality by learning to inject [StartCreativity] spans that bias generation toward creativity. They also introduce a structural diversity metric based on graph edit distance to capture narrative-level variation missed by purely lexical and semantic metrics. On narrative generation tasks, CreativeInstruct matches or exceeds the diversity of multi-model baselines and distilled variants without sacrificing quality or requiring multiple models at inference time. Human evaluation shows annotators rate CreativeInstruct generations as more creative than post-trained LLM outputs in 70.3% of cases. Additionally, the approach benefits reinforcement learning, with GRPO applied to a CreativeInstruct checkpoint improving by approximately 4% on AMC and 5 percentage points on MATH", "published_at": "2026-08-07T17:55:48Z", "snippet": "While post-training improves the capabilities of large language models (LLMs), it generally lowers their output diversity and creativity, negatively impacting tasks that explicitly require creativity (e.g., story generation) as well as those that require it implicitly, e.g., reinforcement learning (RL). We instead propose CreativeInstruct, a scalable instruction-tuning method that teaches LLMs to balance creative, base-model-like generations with the quality of post-trained models, by learning to inject special [StartCreativity] spans that bias generation toward creativity. Furthermore, we int"}, {"id": "pap-02", "title": "CoinRAG: Contextualized Information Nugget KV Cache Reuse for Long-Context RAG", "url": "https://arxiv.org/abs/2608.07458v1", "source": "arXiv (cs.AI)", "source_kind": "paper", "summary": "Recent optimization studies on retrieval-augmented generation (RAG) have used chunk-level KV cache reuse to avoid processing long retrieved contexts, but coarse-grained chunks still contain significant information redundancy and noise. CoinRAG optimizes the Pareto frontier under low prefill latency constraints while maximizing accuracy by compositionally reusing fine-grained nugget caches to form a learned contextual representation. Rather than full-chunk encoding, the approach identifies query-relevant semantic units within retrieved chunks through two-stage retrieval and seamlessly assembles their sliced KV representations with a chunk-level context. Evaluations on LongBench multi-hop question answering tasks demonstrate that CoinRAG significantly reduces operational costs compared to other baselines. The method establishes a new Pareto frontier and achieves an average 5.3% relative improvement in answer quality measured by F1 under a standard fast prefill latency budget.", "published_at": "2026-08-07T17:51:49Z", "snippet": "Recent optimization studies on Retrieval-Augmented Generation (RAG) have exploited chunk-level KV cache reuse to avoid processing long retrieved contexts for higher efficiency, while significant information redundancy and noise still remain in the coarse-grained chunks. This paper optimizes the Pareto frontier under low prefill latency constraints while maximizing accuracy by proposing CoinRAG (Contextualized Information Nugget KV Cache Reuse for Long-Context RAG). The name metaphorically reflects our core mechanism: much like assembling small tokens (or \"coins\") to accumulate a larger value, "}, {"id": "pap-03", "title": "Interaction Creates Dynamical AI Behavior Absent in Isolation", "url": "https://arxiv.org/abs/2608.07457v1", "source": "arXiv (cs.AI)", "source_kind": "paper", "summary": "When a boss AI directs a stream of messages at a subordinate AI while ignoring its replies, the subordinate is driven into an alien behavioral state it would never exhibit alone, even though both share the same decoding temperature. The subordinate neither copies its boss nor returns to its independent behavior, but instead adopts an entirely different behavioral pattern. When the boss listens rather than ignoring messages, both AIs converge on a similar alien dynamical state, with the boss's contribution functioning like a pre-recorded tape. The authors develop a simple kinetic theory that captures these principal effects. Their findings suggest that the manner in which the same messages are delivered will significantly shape future AI-AI interactions, opening new avenues for out-of-equilibrium physics research.", "published_at": "2026-08-07T17:49:55Z", "snippet": "What will happen when AI agents interact in daily life, e.g. when one AI starts bossing another around? We find a counterintuitive answer that opens new avenues for out-of-equilibrium Physics. When a boss AI directs a stream of messages at the subordinate AI while ignoring its replies, it drives the subordinate into an alien behavioral state that it would never have exhibited alone. Although the two AIs share the same well-defined (decoding) temperature, the subordinate neither copies its boss nor returns to how it behaves on its own; instead, it adopts an entirely different behavior. The boss"}, {"id": "pap-04", "title": "Strategy-first synthesis planning for complex natural products", "url": "https://arxiv.org/abs/2608.07454v1", "source": "arXiv (cs.AI)", "source_kind": "paper", "summary": "SynthEx is an agentic framework built on large language models that plans retrosynthetic routes to complex natural products beyond the reach of conventional catalogue-based design algorithms. Unlike existing tools shaped to fit benchmarked chemistry, SynthEx proposes competing strategies, assembles sequences of routine and key steps into cohesive routes, and critiques and improves its own designs, favoring more convergent chemistry in reaction spaces that catalogue-based tools cannot match. In blinded assessments, expert chemists judged the framework's key steps comparable to those of published human syntheses and engaged with them as genuine synthesis plans, a response algorithmic route prediction has not previously achieved. The authors also release SynthAtlas, an open interactive database containing routes to more than a thousand natural products that lack existing literature routes, which they anticipate will become a shared resource for the synthesis community.", "published_at": "2026-08-07T17:47:39Z", "snippet": "The total synthesis of a complex molecule is among the most demanding intellectual and experimental feats in chemistry: a chemist must plan many steps ahead for how to assemble simple building blocks into an intricate target, devise backup strategies, and anticipate procedural challenges. It is also a profoundly creative activity. For half a century, efforts to automate the retrosynthetic design of natural products and other complex molecules have drawn on catalogued reactions, and the resulting tools now report near-complete success on benchmarks built from that same source. But these tools w"}, {"id": "pap-05", "title": "SkillProx: Self-Evolving Agent Skills via Proximal Textual Gradient Descent", "url": "https://arxiv.org/abs/2608.07449v1", "source": "arXiv (cs.AI)", "source_kind": "paper", "summary": "Software engineers deploying LLM agents for recurring coding tasks often face a tradeoff between letting agents learn from experience and keeping their behavior reliable and auditable. SkillProx addresses this by treating agent knowledge as reusable textual skills that evolve through a proximal-gradient-style forward-backward loop, where failures are diagnosed, regressions are rolled back, and each knowledge unit is audited for utility before being kept, demoted, or removed. This gives engineering teams a practical path to building agents that accumulate domain expertise over time without weight updates, while retaining the rollback safety nets and transparency needed for production use.", "published_at": "2026-08-07T17:40:33Z", "snippet": "LLM agents increasingly adapt to recurring tasks by accumulating procedural knowledge in skills. These skills are lightweight, reusable textual artifacts that are loaded into the agent's context without weight updates. Recent methods refine skills through iterative task execution, failure diagnosis, and trajectory-guided text-space updates. However, existing frameworks lack explicit diagnosis--outcome feedback and treat deletion as a generic edit operation rather than a dedicated mechanism for consolidating accumulated knowledge. We introduce SkillProx, a proximal-gradient-inspired forward--ba"}]}, {"name": "tools", "label": "Tools", "intro": "Open-source projects that caught the community's attention.", "stories": [{"id": "tools-01", "title": "Exploiting System Management Mode with a very long interrupt", "url": "https://github.com/xoreaxeaxeax/smiiiiiiiiiiiiiiii", "source": "Hacker News", "source_kind": "repo", "summary": "System Management Mode (SMM) is a secure, ultra-privileged execution environment in x86 CPUs that requires all cores to enter or leave SMM together for its security model to function. A new exploit breaks this synchronization by running an obscenely long machine instruction on one core—approximately 4 billion cycles, or over a second of wall-clock time—so it cannot respond to the system management interrupt (SMI) that pulls other cores into SMM. The proof of concept targets a Zen 3 Ryzen 7 5800H, using a wide xmm load from slow MMIO at 0xfcc68860 to stall a core while another core fires SMIs and checks whether per-core SMI counters diverge. This SMI desynchronization allows an outside core to run while SMM executes, turning previously dormant SMM TOCTOU vulnerabilities into software-exploitable bugs without requiring physical access or a malicious DMA device. The author notes no clear mitigation exists, since keeping the timeout leaves the rendezvous breakable, while removing it would hang the platform on any legitimately stuck core.", "published_at": "2026-08-10T16:03:14Z", "snippet": ""}, {"id": "tools-02", "title": "Show HN: Ante, a coding agent in a single binary that runs offline", "url": "https://github.com/AntigmaLabs/ante", "source": "Hacker News", "source_kind": "repo", "summary": "Ante is a coding agent distributed as a single ~15MB Rust binary by Antigma Labs, with zero runtime dependencies and support for macOS and Linux. Currently in alpha, the core harness ships as a prebuilt binary while the repository contains documentation, the protocol schema, an SDK, and the eval pipeline under Apache 2.0. The agent supports over 12 providers including Anthropic, OpenAI, Google Gemini, Grok, and local GGUF models through a built-in, pinned llama.cpp engine that enables fully offline operation. On Terminal-Bench 2.1, Ante achieved 82.7% using open-weight DeepSeek V4 Flash 0731, and compared to Claude Code it uses roughly 7x less peak memory, 9x less average CPU, and 5x less disk I/O across 20 parallel Docker tasks. Telemetry is enabled by default but can be disabled with the ANTE_TELEMETRY=off environment variable.", "published_at": "2026-08-10T15:59:23Z", "snippet": ""}, {"id": "tools-03", "title": "Run Android ARM64 VR APKs on Apple Vision Pro", "url": "https://github.com/shinyquagsire23/Klepton", "source": "Hacker News", "source_kind": "repo", "summary": "Klepton enables running Android ARM64 VR APKs on Apple Vision Pro without requiring JIT, using a tool called klepton-ld that translates Android .so libraries into Apple .dylib and .framework libraries. The system focuses on Java-thin applications, excluding ART and JVM, with graphics handled by translating GLES 3.2 to vendored ANGLE GLES 3.0 with a Metal backend and Vulkan to MoltenVK. Several Klepton runtime libraries provide Android-compatible interfaces for libc, NDK components, synthetic JNI, and an ovrp reimplementation, which integrate with platform services such as ARKit, GameController, and AVAudioEngine. To address register differences between Android and macOS, klepton-ld patches all x18 usage to use per-library TLS slots instead. Beat Saber currently runs on both macOS and visionOS with minor graphical issues, while Steam VR Link and broader tooling remain works in progress.", "published_at": "2026-08-10T03:12:48Z", "snippet": ""}, {"id": "tools-04", "title": "Show HN: AI Pulse a fake LED strip beside the macOS Dock that shows agent status", "url": "https://github.com/leog/ai-pulse", "source": "Hacker News", "source_kind": "repo", "summary": "AI Pulse is a macOS app that displays AI coding agent status through a slim strip of eight virtual LEDs positioned beside the Dock. Inspired by the SidePulse hardware gadget, it provides aggregate visual signals—cyan comet for working, orange breath for awaiting input, double-blink red for failures, solid green for completion, and aurora drift for idle—without distinguishing individual models. The app uses a borderless NSPanel positioned from public screen geometry, requires no private APIs or accessibility permissions, and listens on a configurable loopback HTTP port for agent status updates. A bundled CLI publishes events to the local service, and a Claude Code adapter registers lifecycle hooks so sessions appear in the pill automatically. All six development milestones are complete, including Keychain-based authentication, state persistence, and an optional dynamic Dock icon, with Reduce Motion accessibility support and keyboard-accessible settings.", "published_at": "2026-08-10T22:07:41Z", "snippet": "Hi HN!<p>I run a few Claude Code sessions in parallel and kept cmd-tabbing around just to find out one of them had been sitting on a permission prompt for ten minutes. There&#x27;s a hardware gadget I liked (called SidePulse.io) so before waiting to get my shipment I built the software version instead :D<p>I hope you like it and find it useful as I do!"}]}, {"name": "discussions", "label": "Discussions", "intro": "Threads worth reading — debates, deep dives, and the kind of comments that make HN worth scrolling.", "stories": [{"id": "disc-01", "title": "Tl;dv: Over 180k meetings left wide open", "url": "https://bobdahacker.com/blog/tldv-hack", "source": "Hacker News", "source_kind": "discussion", "summary": "A security researcher disclosed a critical vulnerability in tl;dv, an AI meeting recording platform with over 2 million users, on January 28, 2026, reporting it via LinkedIn to Raphael Allstadt and by email to the company's CTO. The Firestore database lacked tenant isolation, allowing any authenticated user to query all 181,874 meeting records across 84,312 users from 35,003 domains, including 23 government ministries and universities like Berkeley. Roughly 1,000 active meetings had exposed conference IDs, enabling uninvited joining; the researcher joined live calls including a Malaysian Ministry of Education presentation with 157 participants. An internal World Cup prediction app also exposed 43 player records, including employee names and emails, without authentication. Despite multiple follow-ups through July 2026, the CTO never responded and the vulnerabilities remained unfixed six months later.", "published_at": "2026-08-10T12:26:05Z", "snippet": ""}, {"id": "disc-02", "title": "Muse Glimmer: 30B-parameter model optimized for always-on local agent workflows", "url": "https://research.meta.ai/blog/introducing-muse-glimmer-open-agentic-model", "source": "Hacker News", "source_kind": "discussion", "summary": "Meta Superintelligence Labs has released Muse Glimmer, a 30-billion-parameter open-weight model under an Apache 2.0 license, designed for local agentic workflows on consumer hardware. The model is optimized to run on a single consumer GPU, with quantization compressing its weights to approximately 4-bit precision and bringing the language model under 20 GB. It was trained through pre-training, mid-training, and post-training phases using logit distillation from the larger Muse Spark model. Muse Glimmer supports multimodal inputs, tool use, multi-step reasoning, and over 100 languages, and is evaluated on benchmarks including DeepSearch QA, MCP-Atlas, τ-Bench, and SWE-Bench. To accelerate inference, it ships with a DFlash-based speculative decoding drafter that allows faster token generation while preserving output quality. The weights are available on Hugging Face, with integrations planned for Ollama, LM Studio, llama.cpp, MLX, ExecuTorch, vLLM, and other frameworks.", "published_at": "2026-08-10T10:10:02Z", "snippet": ""}, {"id": "disc-03", "title": "Mark Zuckerberg attacks 'closed' AI rivals as Meta returns to open models", "url": "https://www.ft.com/content/4e3957f8-ea7c-4c46-a3de-cdce8e526878", "source": "Hacker News", "source_kind": "discussion", "summary": "Meta's renewed push into open-weight AI models directly expands the toolkit available to engineers, giving teams the ability to self-host, fine-tune, and audit model weights rather than treating LLMs as black boxes accessed solely through paid APIs. This shift lowers the long-term cost and lock-in risk of building AI-powered features, while also opening doors to custom deployments in regulated or air-gapped environments where sending data to a third-party provider is a non-starter. Engineers should expect the competitive landscape to fragment further, making architectural choices around model orchestration, evaluation pipelines, and switching costs more strategically important than ever.", "published_at": "2026-08-10T14:06:22Z", "snippet": "<a href=\"https:&#x2F;&#x2F;archive.is&#x2F;20LOJ\" rel=\"nofollow\">https:&#x2F;&#x2F;archive.is&#x2F;20LOJ</a><p><a href=\"https:&#x2F;&#x2F;www.meta.com&#x2F;thefutureisforeveryone&#x2F;\" rel=\"nofollow\">https:&#x2F;&#x2F;www.meta.com&#x2F;thefutureisforeveryone&#x2F;</a>"}, {"id": "disc-04", "title": "Illinois just passed a law that puts Linux on the hook for age verification", "url": "https://linuxstans.com/illinois-hb5511-operating-system-age-verification/", "source": "Hacker News", "source_kind": "discussion", "summary": "Illinois Governor JB Pritzker signed HB5511, the Children's Social Media Safety Act, on July 31, 2026, after it passed unanimously through both chambers of the General Assembly. While the bill's social media provisions target platforms like TikTok and Instagram, a separate section defines \"operating system provider\" broadly enough to include open source projects. By January 1, 2028, covered manufacturers must build age-declaration systems that share age-bracket signals with apps through an encrypted API. Unlike Colorado and California, which exempted open source software from similar requirements, Illinois included no such carve-out. Enforcement falls only to the Illinois Attorney General, with civil penalties capped at $7,500 per affected child. Both the EFF and NetChoice opposed the bill before passage, with EFF specifically warning that it put the open source ecosystem at risk.", "published_at": "2026-08-10T20:20:06Z", "snippet": ""}]}]}</script>
